[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }} — a Karni project."
requires-python = ">=3.12"
dependencies = [
    "karni",
    "gunicorn",
    "uvicorn-worker",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# Karni's architecture rules run as a SEPARATE invocation (never via addopts):
#   pytest --pyargs karni.testing.architecture
