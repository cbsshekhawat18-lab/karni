# Development stack for {{ cookiecutter.project_name }}.
#
#   cp .env.example .env && docker compose up --build
#
# django runs migrations before serving, so worker and beat (which need the
# django-celery-beat / django-celery-results tables) wait on django's
# healthcheck, not just on db/redis.
# KARNI_SRC (from .env) optionally installs a vendored karni checkout — see README.md.

services:
  django:
    build:
      context: .
      target: dev
      args:
        KARNI_SRC: ${KARNI_SRC:-}
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness endpoint only responds once migrations have finished and
      # runserver is up — downstream services key off this.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: karni
      POSTGRES_PASSWORD: karni
      POSTGRES_DB: karni
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "karni", "-d", "karni"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: dev
      args:
        KARNI_SRC: ${KARNI_SRC:-}
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - .:/app
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy

  beat:
    build:
      context: .
      target: dev
      args:
        KARNI_SRC: ${KARNI_SRC:-}
    # --pidfile= disables the pidfile; a stale one in the bind mount would
    # otherwise block restarts.
    command: celery -A config beat -l info --pidfile=
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Runs `npm install`, then Vite (see frontend/Dockerfile.dev).
    environment:
      KARNI_API_PROXY: http://django:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Container-built node_modules (Linux binaries), never the host's.
      - frontend_node_modules:/app/node_modules
{%- if cookiecutter.karni_ui.startswith("file:") %}
      # The local @karni/ui checkout that package.json's "file:" spec names,
      # mounted read-only at the SAME absolute path so npm resolves it here too.
      - type: bind
        source: {{ cookiecutter.karni_ui[5:] | tojson }}
        target: {{ cookiecutter.karni_ui[5:] | tojson }}
        read_only: true
{%- endif %}

volumes:
  postgres_data:
  app_data:
  frontend_node_modules:
