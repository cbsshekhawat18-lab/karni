# yaml-language-server: $schema=https://cbsshekhawat18-lab.github.io/karni/assets/karni-spec.schema.json
version: 1
app:
  name: Bench App
  kind: app
modules:
  payments: {provider: test, currency: usd}
roles:
  staff: {name: Staff, system: true, grants: {"*": all}}
  customer:
    name: Customer
    default: true
    grants:
      shop.order: own
      shop.orderitem: own
apps:
  shop:
    entities:
      Category:
        fields: {name: "str:120"}
        order: name
        access: {read: authenticated, write: "role:staff"}
      Product:
        fields:
          category: fk:Category
          name: "str:200"
          price: "money:USD"
          stock: quantity
        search: [name]
        order: name
        access: {read: authenticated, write: "role:staff"}
      Cart:
        fields: {customer: fk:User}
        owner: customer
        access: {read: "role:staff", write: "role:staff"}
      CartItem:
        fields: {cart: fk:Cart, product: fk:Product, quantity: int}
        access: {read: "role:staff", write: "role:staff"}
      Order:
        fields:
          customer: fk:User
          status: "state:pending>paid|paid>shipped|paid>refunded|shipped>refunded"
          total: "money:USD"
          payment: "fk:karni_payments.Payment?"
        owner: customer
        audit: [status]
        order: -created_at
        access: {read: ["owned:customer", "role:staff"], write: "role:staff"}
      OrderItem:
        fields: {order: fk:Order, product: fk:Product, quantity: int, unit_price: "money:USD"}
        owner: order__customer
        access: {read: ["owned:order__customer", "role:staff"], write: "role:staff"}
pages:
  - home: dashboard
  - Product: [list, detail, form]
  - Category: [list, form]
  - Order: [list, detail]
seed: {Category: 3, Product: 10, Order: 0}
