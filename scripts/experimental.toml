[[allow]]
path = "*"
line = '''["']experimental["']'''
reason = "a value, not the mark: a manifest's status (stable or experimental) and the code and tests that read it"

[[allow]]
path = "packages/karni/karni/catalog/__init__.py"
line = 'stable or experimental|\(stable\|experimental\)'
reason = "the manifest's status values"

[[allow]]
path = "*"
line = 'check_experimental|experimental\.toml'
reason = "a reference to this check or its list, not a mark"

[[allow]]
path = "docs/modules.md"
line = '`stable` or `experimental`'
reason = "the manifest's status values"

[[allow]]
path = "docs/roadmap/*"
line = '.'
reason = "the plans say how a new name ships (in the experimental tier), not a mark"

[[allow]]
path = "docs/stability.md"
line = '.'
reason = "the rule itself"

[[allow]]
path = "docs/REFERENCE.md"
line = '`experimental`'
reason = "the status column, generated by scripts/gen_reference.py"

[[allow]]
path = "docs/features.md"
line = '`experimental`'
reason = "the status of each capability, generated by scripts/gen_reference.py"

[[allow]]
path = "scripts/gen_reference.py"
line = '.'
reason = "computes the status experimental and its note"

[[allow]]
path = "scripts/gen_reference_ui.mjs"
line = '.'
reason = "drops the mark from the summaries it reads"

[[allow]]
path = "scripts/check_experimental.py"
line = '.'
reason = "this check"

[[allow]]
path = "packages/karni-cli/tests/test_experimental_marks.py"
line = '.'
reason = "the tests of this check"

[[allow]]
path = "examples/*/frontend/src/api/*"
line = '.'
reason = "the typed client `karni types` wrote from an example's schema at the time: it follows the docstrings on the example's next `karni types`, with the rest of the drift since"

[[allow]]
path = "packages/karni-ui/tests/axe.ts"
line = 'axe has this rule, but it is experimental'
reason = "a rule of the axe library, not a Karni name"
