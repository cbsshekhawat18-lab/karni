# The features that are experimental now (docs/stability.md#experimental-names),
# read by scripts/check_experimental.py (CI and
# packages/karni-cli/tests/test_experimental_marks.py).
#
# [[feature]]: its name, `docs` (the sections that open with the note: a page,
# `page.md#anchor`, or a package README; the first one is the link of its line
# in docs/stability.md's "Experimental now") and `marks` (its public entry
# points, whose docstring or doc comment starts with "Experimental.": `path`
# for a module's docstring or a file's first doc comment, `path::name` for one
# class, function or export).
# [[allow]]: where the word is not the mark (`path` an fnmatch glob, `line` a
# regular expression the line matches), with the reason.
#
# A feature that becomes stable leaves this file, its line moves to "Stable
# since <version>" in docs/stability.md, and its notes and marks go.

