site_name: Karni
site_description: "Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain. The API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers every coding agent. The build fails when an agent hand-writes what Karni ships."
site_url: https://cbsshekhawat18-lab.github.io/karni/
repo_url: https://github.com/cbsshekhawat18-lab/karni
repo_name: cbsshekhawat18-lab/karni
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
# docs/seo/ holds Karni's canonical description (description.txt, read by
# scripts/check_description.py): kept in the repository, not published.
exclude_docs: |
  seo/
hooks:
  - scripts/docs_seo.py

theme:
  name: material
  custom_dir: docs/overrides
  # The look of the Karni page on gigaikripaservices.com: a black ground, one
  # orange accent (#FB5D08), Jost for headings, Inter for text, JetBrains Mono
  # for code. That page is dark only, so this site is too. The colours,
  # header, buttons and cards are in docs/stylesheets/karni.css.
  logo: assets/brand/karni-mark.svg
  favicon: assets/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/karni.css

extra_javascript:
  - javascripts/a11y.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

