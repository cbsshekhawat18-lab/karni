name: Security scans

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily, so a CVE published between two pull requests is still caught.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python — pip-audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/karni, packages/karni-cli, modules/karni-payments, modules/karni-approvals]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit "./${{ matrix.package }}"
      - name: pip-audit the installed environment
        # Fails on a known vulnerability in anything the package pulls in.
        run: python -m pip_audit --vulnerability-service osv --skip-editable

  npm-audit:
    name: npm — audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/karni-ui, modules/karni-payments/ui, modules/karni-approvals/ui, examples/eventhub/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  secrets:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
