name: Release

# Pushing a tag vX.Y.Z publishes every package at X.Y.Z (lockstep versioning,
# docs/releasing.md): karni, karni-cli, karni-payments, karni-approvals and
# karni-impersonation to PyPI; @karni/ui, @karni/payments-ui,
# @karni/approvals-ui and @karni/impersonation-ui to npm; each with build
# provenance.
#
# Publishing is off until the repository variable KARNI_PUBLISHING names the
# registries to publish to: "pypi", "npm", "pypi,npm" or "true" (both)
# (Settings → Secrets and variables → Actions → Variables). Each registry is
# switched on once its trusted publishers exist. Before that, and
# on every "Run workflow" with dry_run checked, the workflow is a dry run: it
# runs CI, checks the release metadata, builds every distribution, runs
# `twine check --strict`, installs the wheels into a clean venv, runs
# `npm publish --dry-run`, uploads the artifacts for inspection and publishes
# nothing. A tag push with the variable set is the only path that publishes.
#
# One-time setup (repository settings, not code):
#   - PyPI: add a (pending) trusted publisher for each of the five projects
#     (this repository, workflow release.yml, environment "pypi").
#   - npm: add a trusted publisher for each of the four packages
#     (this repository, workflow release.yml, environment "npm"). No token is
#     stored; npm exchanges the workflow's OIDC token at publish time.
#   - Environments "pypi" and "npm": add required reviewers to gate a publish
#     on a human.
#   - Variable KARNI_PUBLISHING, last: the registries that are set up.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, check and upload every artifact; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide once whether this run publishes, and which version it is for.
  # A dispatched run on a branch has no tag: the version comes from
  # packages/karni/pyproject.toml so the metadata check still runs.
  mode:
    name: Publish or dry run
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      pypi: ${{ steps.mode.outputs.pypi }}
      npm: ${{ steps.mode.outputs.npm }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        env:
          PUBLISHING: ${{ vars.KARNI_PUBLISHING }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          publish=false
          case ",$PUBLISHING," in
            ,true,) registries="pypi,npm" ;;
            *) registries="$PUBLISHING" ;;
          esac
          pypi=false
          npm=false
          if [ -n "$registries" ] && [[ "$REF" == refs/tags/v* ]]; then
            case "$EVENT:$DRY_RUN" in
              push:*|workflow_dispatch:false) publish=true ;;
            esac
          fi
          if [ "$publish" = "true" ]; then
            [[ ",$registries," == *,pypi,* ]] && pypi=true
            [[ ",$registries," == *,npm,* ]] && npm=true
            [ "$pypi" = "true" ] || [ "$npm" = "true" ] || publish=false
          fi
          if [[ "$REF" == refs/tags/* ]]; then
            tag="${REF#refs/tags/}"
          else
            tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("packages/karni/pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "pypi=$pypi" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## Release $tag"
            if [ "$publish" = "true" ]; then
              echo "Publishing to: $( [ "$pypi" = true ] && echo -n 'PyPI ' )$( [ "$npm" = true ] && echo -n 'npm' ) (KARNI_PUBLISHING=$PUBLISHING, release tag)."
            elif [ -z "$PUBLISHING" ]; then
              echo "Dry run: the repository variable KARNI_PUBLISHING is not set; nothing will be published."
            elif [[ "$REF" != refs/tags/v* ]]; then
              echo "Dry run: \`$REF\` is not a release tag; nothing will be published."
            else
              echo "Dry run requested; nothing will be published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Every gate CI runs on main, run again on exactly this commit. The called
  # workflow's docs job declares pages/id-token permissions (it only deploys
  # on a push to main), and a caller must grant what a callee declares.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  check:
    name: Release metadata
    needs: mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - name: Versions, repository URLs, licences, module ranges
        env:
          TAG: ${{ needs.mode.outputs.tag }}
        run: python .github/ci/check_release.py --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  build-python:
    name: Build Python distributions
    needs: [ci, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # Each package builds from its own directory; karni-cli's build hook
      # bundles templates/project, the agent rules and the changelog into it.
      - name: Build sdists and wheels
        run: |
          set -euo pipefail
          for d in packages/karni packages/karni-cli modules/karni-payments modules/karni-approvals modules/karni-impersonation; do
            python -m build --outdir dist "$d"
          done
          python -m twine check --strict dist/*
      # What a user gets: the wheels alone, in a venv with no source tree,
      # must give a working `karni` with its bundled template and registry.
      - name: Install the wheels into a clean venv
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
          /tmp/clean/bin/karni --help
          /tmp/clean/bin/karni explain E104
          /tmp/clean/bin/python -c "import karni, karni.links; print('karni', karni.__version__, karni.links.DOCS_BASE_URL)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-npm:
    name: Build npm packages
    needs: [ci, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # `npm publish --dry-run` runs the full publish pipeline — prepack,
      # the files list, the tarball manifest — and stops before the upload;
      # it needs no credentials. The packed tarballs go up as an artifact.
      - name: Build, dry-run publish and pack (@karni/ui first; payments-ui peers on it)
        run: |
          set -euo pipefail
          mkdir -p npm-dist
          for d in packages/karni-ui modules/karni-payments/ui modules/karni-approvals/ui modules/karni-impersonation/ui; do
            (cd "$d" && npm ci && npm run build && npm publish --dry-run --access public)
            npm pack --pack-destination npm-dist "./$d"
          done
          ls -l npm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [mode, build-python]
    if: needs.mode.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # trusted publishing + PEP 740 attestations (provenance)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      # One upload per project, core first: a project whose trusted publisher
      # is missing stops the job without half-publishing the others, and
      # skip-existing makes a re-run after fixing it safe.
      - name: One directory per project
        run: |
          set -euo pipefail
          for project in karni karni_cli karni_payments karni_approvals karni_impersonation; do
            mkdir -p "pypi/$project"
            mv dist/"$project"-[0-9]* "pypi/$project/"
          done
          if [ -n "$(ls -A dist)" ]; then echo "unexpected files in dist/:"; ls dist; exit 1; fi
          ls -R pypi
      - name: karni
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/karni/, attestations: true, skip-existing: true }
      - name: karni-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/karni_cli/, attestations: true, skip-existing: true }
      - name: karni-payments
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/karni_payments/, attestations: true, skip-existing: true }
      - name: karni-approvals
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/karni_approvals/, attestations: true, skip-existing: true }
      - name: karni-impersonation
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pypi/karni_impersonation/, attestations: true, skip-existing: true }

  publish-npm:
    name: Publish to npm
    # After PyPI: a JS-only failure must not leave npm ahead of the backend
    # it talks to.
    needs: [mode, build-npm, publish-pypi]
    # publish-pypi may be skipped (npm alone); it must not have failed.
    if: needs.mode.outputs.npm == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Build and publish (@karni/ui first; payments-ui peers on it)
        run: |
          set -euo pipefail
          for d in packages/karni-ui modules/karni-payments/ui modules/karni-approvals/ui modules/karni-impersonation/ui; do
            (cd "$d" && npm ci && npm run build && npm publish --provenance --access public)
          done

  github-release:
    name: GitHub release
    needs: [mode, build-npm, publish-pypi, publish-npm]
    # After whichever registries this run published to; none may have failed.
    if: needs.mode.outputs.publish == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      # The npm tarballs too: until a package is on npm, the release is where
      # it installs from (npm install <release URL>/karni-ui-X.Y.Z.tgz).
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist/
      - name: Create the release with the built distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.mode.outputs.tag }}
        # A release made by hand before registry publishing was set up (0.2.0,
        # 0.3.0) already exists: replace its files instead of failing.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notes="Migration notes: docs/migrations/. Upgrade with \`karni upgrade --to ${TAG#v}\`."
            gh release create "$TAG" dist/* --title "Karni ${TAG#v}" \
              --notes "$notes" --verify-tag
          fi

  dry-run-summary:
    name: Dry run complete
    needs: [mode, build-python, build-npm]
    if: needs.mode.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report what would have been published
        env:
          TAG: ${{ needs.mode.outputs.tag }}
        run: |
          {
            echo "## Dry run complete — nothing was published"
            echo
            echo "Every gate passed for $TAG: CI, release metadata, \`python -m build\` + \`twine check --strict\`,"
            echo "a clean-venv install of the wheels, and \`npm publish --dry-run\` for every npm package."
            echo
            echo "Artifacts to inspect: **python-dist** (sdists and wheels) and **npm-dist** (packed tarballs)."
            echo
            echo "To publish: set the repository variable \`KARNI_PUBLISHING\` to \`true\` and push a \`vX.Y.Z\` tag (docs/launch-registrations.md, step 16)."
          } >> "$GITHUB_STEP_SUMMARY"
