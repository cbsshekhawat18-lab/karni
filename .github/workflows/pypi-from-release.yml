name: Publish a release to PyPI

# Uploads the Python distributions attached to an existing GitHub release
# (the files release.yml built and checked) to PyPI, one project at a time,
# core first, skipping files PyPI already has. For a release whose PyPI step
# could not run (0.3.1 was released before PyPI publishing was set up) or
# failed part-way. Authenticates with the PYPI_API_TOKEN secret when it is
# set, else with trusted publishing (environment "pypi").

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Upload ${{ inputs.tag }} to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing, when no token is set
    steps:
      - name: Download the release's Python files, one directory per project
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          version="${TAG#v}"
          for project in karni karni_cli karni_payments karni_approvals karni_impersonation; do
            mkdir -p "pypi/$project"
            mv dist/"$project-$version"[-.]* "pypi/$project/"
          done
          if [ -n "$(ls -A dist)" ]; then echo "unexpected files in dist/:"; ls dist; exit 1; fi
          ls -R pypi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: twine check
        run: |
          python -m pip install --quiet twine
          python -m twine check --strict pypi/*/*
      - name: Authentication
        id: auth
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # Attestations need trusted publishing; with a token they are skipped.
        run: |
          if [ -n "$TOKEN" ]; then echo "attest=false" >> "$GITHUB_OUTPUT"; echo "Using the PYPI_API_TOKEN secret."
          else echo "attest=true" >> "$GITHUB_OUTPUT"; echo "Using trusted publishing."; fi
      - name: karni
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/karni/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ steps.auth.outputs.attest }}
      - name: karni-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/karni_cli/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ steps.auth.outputs.attest }}
      - name: karni-payments
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/karni_payments/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ steps.auth.outputs.attest }}
      - name: karni-approvals
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/karni_approvals/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ steps.auth.outputs.attest }}
      - name: karni-impersonation
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/karni_impersonation/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ steps.auth.outputs.attest }}
