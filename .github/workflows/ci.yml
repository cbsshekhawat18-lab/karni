name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml re-runs every gate on the tagged commit before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python: packages/karni, packages/karni-cli, modules/karni-payments, modules/karni-approvals.
  # Every step goes through the root Makefile, so CI and `make` never drift.
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        django: ["5.1.*"]

    services:
      # Only the Postgres step below talks to this; the main suites run on
      # sqlite in-memory (their tests/settings.py pin it).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON: python
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            packages/karni/pyproject.toml
            packages/karni-cli/pyproject.toml
            modules/karni-payments/pyproject.toml
            modules/karni-approvals/pyproject.toml

      - name: Install packages (editable) + dev tools
        run: make install-py

      - name: Pin Django ${{ matrix.django }}
        run: python -m pip install "Django==${{ matrix.django }}"

      - name: Versions
        run: python -c "import sys, django; print(sys.version); print('Django', django.get_version())"

      - name: Lint (ruff check + ruff format --check)
        run: make lint-py

      - name: Typecheck (mypy, root mypy.ini)
        run: make typecheck-py

      - name: Test (pytest, sqlite)
        run: make test-py

      # packages/karni/tests/settings.py pins sqlite and does not read
      # DATABASE_URL, so the Postgres-only tests (skipped unless
      # connection.vendor == "postgresql") run through a CI settings overlay:
      # .github/ci/karni_postgres_settings.py. --no-migrations is required
      # because tests.testapp (unmigrated) has a FK to the migrated user model.
      # The OpenAPI snapshot test is deselected here: the committed snapshot is
      # generated on sqlite, and drf-spectacular derives integer bounds from
      # the backend (PositiveIntegerField max 2^63-1 on sqlite, 2^31-1 + int32
      # format on Postgres). It runs in the sqlite step above.
      - name: Enable pg_trgm for test databases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Test packages/karni on PostgreSQL 16
        working-directory: packages/karni
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/karni
          PYTHONPATH: ${{ github.workspace }}/.github/ci
        run: |
          python -m pip install "psycopg[binary]>=3.1"
          python -m pytest -q -ra --ds=karni_postgres_settings --no-migrations \
            --deselect tests/api/test_schema_snapshot.py::test_schema_snapshot_is_current

      # -----------------------------------------------------------------------
      # Agent adapters vs karni/agent/rules.py (docs/agents.md). Scaffolds a
      # project, then `karni rules sync --check` fails if any generated adapter
      # (AGENTS.md, CLAUDE.md, .cursor/rules/karni.mdc, ...) differs from what
      # the rule registry produces; also fails if the generated procedures
      # block in docs/agents.md is stale. Projects run the same
      # `karni rules sync --check` in their own CI (`make check`).
      # -----------------------------------------------------------------------
      - name: Agent adapters are up to date (karni rules sync --check)
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          karni new "Adapter Check" -o "$work"
          (cd "$work/adapter_check" && karni rules sync --check)
          karni rules --prompts-doc > "$work/prompts.md"
          python - "$work/prompts.md" docs/agents.md <<'PY'
          import sys
          block, docs = (open(path).read().strip() for path in sys.argv[1:])
          if block not in docs:
              sys.exit("docs/agents.md procedures block is stale: paste `karni rules --prompts-doc`")
          PY

  # ---------------------------------------------------------------------------
  # docs/quickstart.md, run verbatim on a clean machine: every `sh` block on
  # the page, in a fresh venv and an empty directory, with this checkout's
  # packages in place of PyPI's (the one documented substitution).
  # ---------------------------------------------------------------------------
  quickstart:
    name: Quickstart (docs/quickstart.md, verbatim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build @karni/ui (karni new installs it from the checkout)
        working-directory: packages/karni-ui
        run: npm ci && npm run build
      - name: Run the page
        env:
          KARNI_UI_SRC: ${{ github.workspace }}/packages/karni-ui
        run: |
          python .github/ci/quickstart.py \
            --install "pip install -q -e ${{ github.workspace }}/packages/karni -e ${{ github.workspace }}/packages/karni-cli pytest pytest-django"

  # ---------------------------------------------------------------------------
  # The documentation site (Material for MkDocs): built strictly on every
  # push and pull request, deployed to GitHub Pages from main.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs-material
      - name: "Build (strict: a broken link or a missing page fails)"
        run: python -m mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  docs-deploy:
    name: Deploy docs
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # examples/eventhub: the reference application, built on the documented
  # surface only. Builds, migrates, seeds, tests, then runs Playwright against
  # the running stack (Django + Celery worker + the production frontend build).
  # A framework change that breaks a real app breaks this job.
  # ---------------------------------------------------------------------------
  eventhub:
    name: EventHub (reference app, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/eventhub

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karni
          POSTGRES_PASSWORD: karni
          POSTGRES_DB: eventhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No .env in CI: the same values a host .env would hold.
      DJANGO_ENV: dev
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
      ALLOWED_HOSTS: "*"
      PROJECT_NAME: eventhub
      DATABASE_URL: postgres://karni:karni@localhost:5432/eventhub
      REDIS_URL: redis://localhost:6379/0
      MEDIA_ROOT: data/media
      STATIC_ROOT: data/static
      KARNI_AUTH_MODE: session
      KARNI_PAYMENTS_PROVIDER: test
      KARNI_FRONTEND_URL: http://127.0.0.1:4173
      KARNI_ACCOUNTS_DEFAULT_ROLES: attendee
      KARNI_SEED_LOGINS: '{"organizer@example.com": ["organizer"], "attendee@example.com": ["attendee"]}'
      PY: python
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/karni/pyproject.toml
            packages/karni-cli/pyproject.toml
            modules/karni-payments/pyproject.toml
            modules/karni-approvals/pyproject.toml
            examples/eventhub/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/karni-ui/package-lock.json
            examples/eventhub/frontend/package-lock.json

      - name: Install Karni from this checkout (the project depends on it)
        run: |
          python -m pip install -e "../../packages/karni[images]" -e ../../packages/karni-cli \
            -e ../../modules/karni-payments -e ../../modules/karni-approvals \
            "psycopg[binary]" pytest pytest-django

      - name: Build @karni/ui (the project installs it from packages/karni-ui)
        working-directory: packages/karni-ui
        run: npm ci && npm run build

      - name: Install the frontend and Playwright's browser
        working-directory: examples/eventhub/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Architecture rules, duplication, agent adapters
        run: |
          karni check
          karni rules sync --check

      - name: Migrate, seed and test
        run: |
          python manage.py migrate --noinput
          python manage.py karni_seed --reset --seed 42
          python -m pytest -q

      - name: Build, start the stack, run Playwright
        run: ./scripts/e2e.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eventhub-e2e
          path: |
            examples/eventhub/frontend/test-results/
            examples/eventhub/.notes-e2e-*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # UI: packages/karni-ui (@karni/ui), modules/karni-payments/ui and modules/karni-approvals/ui.
  # ---------------------------------------------------------------------------
  ui:
    name: UI (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/karni-ui/package-lock.json
            modules/karni-payments/ui/package-lock.json
            modules/karni-approvals/ui/package-lock.json

      # karni-ui first: payments-ui resolves @karni/ui from its source, which
      # imports packages/karni-ui/node_modules.
      - name: npm ci
        run: make install-ui

      - name: Typecheck (tsc --noEmit)
        run: make typecheck-ui

      - name: Lint (eslint + prettier --check)
        run: make lint-ui

      - name: Test (vitest)
        run: make test-ui

      - name: Build (vite, dual ESM/CJS)
        run: make build-ui

      - name: Smoke-test package entry points (require + import)
        run: |
          set -euo pipefail
          cd packages/karni-ui
          node -e "const m = require('@karni/ui'); if (!m.ResourceTable) throw new Error('CJS @karni/ui missing exports'); console.log('cjs', require.resolve('@karni/ui'))"
          node -e "require('@karni/ui/tailwind-preset')"
          node --input-type=module -e "const m = await import('@karni/ui'); if (!m.ResourceTable) throw new Error('ESM @karni/ui missing exports'); console.log('esm', import.meta.resolve('@karni/ui'))"
          node --input-type=module -e "await import('@karni/ui/tailwind-preset'); await import('@karni/ui/eslint-plugin')"
          test -f dist/manifest.json
          cd ../../modules/karni-payments/ui
          node -e "const m = require('@karni/payments-ui'); if (!m.CheckoutButton) throw new Error('CJS payments-ui missing exports')"
          node --input-type=module -e "const m = await import('@karni/payments-ui'); if (!m.CheckoutButton) throw new Error('ESM payments-ui missing exports')"
          cd ../../karni-approvals/ui
          node -e "const m = require('@karni/approvals-ui'); if (!m.ApprovalsQueue) throw new Error('CJS approvals-ui missing exports')"
          node --input-type=module -e "const m = await import('@karni/approvals-ui'); if (!m.ApprovalsQueue) throw new Error('ESM approvals-ui missing exports')"
