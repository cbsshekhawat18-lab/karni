# Repo-wide mypy configuration.
#
# Every Python package is checked from its own directory (each one ships a
# top-level `tests` package, so they cannot share one mypy run):
#
#   cd packages/karni           && mypy --config-file ../../mypy.ini karni tests
#   cd packages/karni-cli       && mypy --config-file ../../mypy.ini karni_cli tests
#   cd modules/karni-payments   && mypy --config-file ../../mypy.ini karni_payments tests
#
# `make typecheck` does exactly this. Django has no inline types and the
# django-stubs plugin is deliberately not wired yet, so Django/DRF imports are
# `Any`; the relaxations below are the debt that plugin (or code fixes) must
# pay down. Each one lists the error count it hides at the time of writing.

[mypy]
python_version = 3.12
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
# Generated cookiecutter output (karni-cli build hook) and Django migrations.
exclude = (?x)(
    /_templates/
    | /migrations/
  )

# --- library code: every def must be annotated -------------------------------

[mypy-karni.*,karni_cli.*,karni_payments.*,karni_approvals.*,karni_impersonation.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# --- packages/karni relaxations (TO TIGHTEN) ----------------------------------
# packages/karni is being rewritten concurrently; these keep the current tree
# green without editing it. Remove each section once its count reaches zero.

# `# type: ignore` comments written for django-stubs semantics are "unused"
# without the plugin. Package-wide because the rewrite keeps adding them.
# Hides: 11 unused-ignore (accounts.permissions 5, storage.s3 2,
# accounts.api.views 1, accounts.twofa 1, admin.base 1, middleware 1).
[mypy-karni.*]
warn_unused_ignores = False

# TextChoices members typed as their raw (value, label) tuple without the
# django-stubs plugin (`Purpose.X.value`). Hides: 3 attr-defined.
[mypy-karni.accounts.tokens]
disable_error_code = attr-defined

# `list[Module]` returned as `list[object]` (list invariance). Hides: 1.
[mypy-karni.testing.architecture]
disable_error_code = return-value

# --- packages/karni test relaxations (TO TIGHTEN) -----------------------------
# Section names are module names, so they only match inside packages/karni.

# factory-boy factories return model instances at runtime; mypy sees the
# Factory class. Hides: 11 attr-defined.
[mypy-tests.accounts.test_models]
disable_error_code = attr-defined

# Same TextChoices tuple issue as karni.accounts.tokens plus factory return
# types. Hides: 30 (arg-type 28, assignment 1, return-value 1).
[mypy-tests.accounts.test_tokens]
disable_error_code = arg-type, assignment, return-value

# Test admins override `list[str]` attributes with tuples. Hides: 2.
[mypy-tests.admin.test_base]
disable_error_code = assignment

# Concrete test models mixing several abstract Karni bases: without the
# django-stubs plugin each base's inner `class Meta` is an incompatible
# definition. Hides: 4 misc (adminapp 2, fieldsapp 2).
[mypy-tests.adminapp.models,tests.testapp.models,tests.fieldsapp.models]
disable_error_code = misc

# Dynamically derived admin class attribute access. Hides: 1.
[mypy-tests.admin.test_derive]
disable_error_code = attr-defined

# Test view overrides a `None`-typed opt-in attribute with a list. Hides: 1.
[mypy-tests.api.test_filtering]
disable_error_code = assignment

# Hides: 2 unused-ignore.
[mypy-tests.api.test_serializer_generation,tests.test_storage]
warn_unused_ignores = False
