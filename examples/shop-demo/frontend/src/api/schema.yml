      - columns
      - created_at
      - error
      - file_name
      - format
      - id
      - keep_ids
      - mapping
      - match_ids
      - model
      - problems
      - result
      - rows_done
      - rows_total
      - status
    ImportMappingRequest:
      type: object
      description: |-
        ``POST …/import/<job>/preview/``: header → field (``""`` ignores a column), id options.

        ``match_ids`` matches existing rows by the file's id column and
