                type: string
                format: binary
          description: ''
      x-karni-access:
        role:
        - payments-admin
  /api/search/:
    get:
      operationId: global_search
      description: 'Experimental. Search every model that declares class Karni: search,
        each through its list endpoint''s access for this request. Results are grouped
        per resource, best first.'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Hits per resource (KARNI_GLOBAL_SEARCH_LIMIT, at most KARNI_GLOBAL_SEARCH_MAX_LIMIT).
      - in: query
        name: models
        schema:
          type: array
          items:
            type: string
        description: 'Comma-separated resources to search (default: every one search
          covers).'
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
        description: The query. Shorter than KARNI_GLOBAL_SEARCH_MIN_LENGTH (2) answers
          no groups.
      tags:
      - search
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSearchError'
          description: ''
      x-karni-search:
        resources: []
components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - restore
      - transition
      type: string
      description: |-
        * `create` - Created
        * `update` - Updated
        * `delete` - Deleted
        * `restore` - Restored
        * `transition` - Transitioned
    Actor:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
      required:
      - email
      - id
    ChangeLog:
      type: object
      description: |-
        One change: when, by whom, what kind, and the fields that changed.

        ``diff`` is ``{field: [old, new]}`` minus the fields ``Karni.field_roles``
        hides from the requesting user (P3), so history never shows a value the
        row itself would not.
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        diff:
          type: object
          additionalProperties: {}
          readOnly: true
        fields_changed:
          type: array
          items:
            type: string
          readOnly: true
        batch:
          type: integer
          readOnly: true
          nullable: true
      required:
      - action
      - actor
      - batch
      - diff
      - fields_changed
      - id
      - timestamp
    CheckoutInputRequest:
      type: object
      description: |-
        Input of ``POST /api/payments/checkout/``.

        The amount is transport, not authority: the server-side
        ``KARNI_PAYMENTS_CHECKOUT_VALIDATOR`` decides whether it is acceptable
        (amendment G2 — never trust client amounts).
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          minLength: 1
          maxLength: 3
        metadata: {}
        success_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
        cancel_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
      required:
      - amount
      - cancel_url
      - success_url
    CheckoutOutput:
      type: object
      description: 'Output of the checkout action: redirect the customer to ``url``.'
      properties:
        payment_id:
          type: string
          format: uuid
          readOnly: true
        session_id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - payment_id
      - session_id
      - url
    EmailChange:
      type: object
      description: |-
        Input for ``email/change/``: the new address plus the current password.

        Uniqueness of ``new_email`` is validated (and re-validated at confirm
        time) by :mod:`karni.accounts.services`, which raises the DRF 400
        directly — the accepted enumeration surface of the flow (amendment A9).
      properties:
        new_email:
          type: string
          format: email
      required:
      - new_email
    EmailChangeRequest:
      type: object
      description: |-
        Input for ``email/change/``: the new address plus the current password.

        Uniqueness of ``new_email`` is validated (and re-validated at confirm
        time) by :mod:`karni.accounts.services`, which raises the DRF 400
        directly — the accepted enumeration surface of the flow (amendment A9).
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_email:
          type: string
          format: email
          minLength: 1
      required:
      - current_password
      - new_email
    GlobalSearchError:
      type: object
      description: 'Experimental. A refused request: E431 and the resources search
        covers.'
      properties:
        code:
          type: string
        detail:
          type: string
        resources:
          type: array
          items:
            type: string
      required:
      - code
      - detail
      - resources
    GlobalSearchGroup:
      type: object
      description: Experimental. The hits of one resource, best first.
      properties:
        resource:
          type: string
        label:
          type: string
          description: The model's plural name, for a heading.
        hits:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSearchHit'
      required:
      - hits
      - label
      - resource
    GlobalSearchHit:
      type: object
      description: 'Experimental. One hit: a row of one resource, ready to link to
        its page.'
      properties:
        resource:
          type: string
          description: The resource (router prefix) of the row.
        id:
          oneOf:
          - type: string
          - type: integer
          description: 'The row''s primary key: its page is /<resource>/<id>.'
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        score:
          type: number
          format: double
          description: Higher is better, the model's weight included.
      required:
      - id
      - resource
      - score
      - subtitle
      - title
    GlobalSearchResult:
      type: object
      description: 'Experimental. The answer of GET /api/search/: groups ordered by
        their best hit.'
      properties:
        query:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSearchGroup'
      required:
      - groups
      - query
    ImportColumn:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        kind:
          type: string
        required:
          type: boolean
        readable:
          type: boolean
        writable:
          type: boolean
        choices:
          type: array
          items:
            type: object
            additionalProperties: {}
        target:
          type: string
          nullable: true
        lookup:
          type: string
          nullable: true
        help:
          type: string
      required:
      - choices
      - help
      - kind
      - label
      - lookup
      - name
      - readable
      - required
      - target
      - writable
    ImportDescribe:
      type: object
      description: '``GET /<resource>/import/``: the importable fields and the remembered
