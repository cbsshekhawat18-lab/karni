      - in: query
        name: conditions
        schema:
          type: string
      - in: query
        name: conditions_descendants
        schema:
          type: boolean
        description: 'true: also the rows tagged with a node below those of ?conditions=.'
      - in: query
        name: created_at
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - in: query
        name: enrollment
        schema:
          type: integer
      - in: query
        name: enrollment__gte
        schema:
          type: integer
      - in: query
        name: enrollment__lte
        schema:
          type: integer
      - in: query
        name: interventions
        schema:
          type: string
      - in: query
        name: interventions_descendants
        schema:
          type: boolean
        description: 'true: also the rows tagged with a node below those of ?interventions=.'
      - in: query
        name: investigator
        schema:
          type: string
          format: uuid
      - in: query
        name: phase
        schema:
          type: string
          enum:
          - phase_1
          - phase_2
          - phase_3
          - phase_4
        description: |-
          * `phase_1` - Phase 1
          * `phase_2` - Phase 2
          * `phase_3` - Phase 3
          * `phase_4` - Phase 4
      - in: query
        name: rollup
        schema:
          type: boolean
        description: 'true: a node also counts the rows tagged with any node below
          it, each row once.'
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sponsor
        schema:
          type: string
          format: uuid
      - in: query
        name: start_year
        schema:
          type: integer
      - in: query
        name: start_year__gte
        schema:
          type: integer
      - in: query
        name: start_year__lte
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - completed
          - recruiting
          - terminated
        description: |-
          * `recruiting` - Recruiting
          * `active` - Active
          * `completed` - Completed
          * `terminated` - Terminated
      - in: query
        name: taxonomy
        schema:
          type: string
          enum:
          - conditions
          - interventions
        description: The taxonomy to count (optional when the model has one).
        required: true
      - in: query
        name: title
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      - in: query
        name: updated_at
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_by
        schema:
          type: string
          format: uuid
      tags:
      - trials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntelTrialFacets'
          description: ''
      x-karni-access:
        can:
        - intel.trial:view
  /api/trials/import/:
    get:
      operationId: trials_import_retrieve
      description: |-
        ``GET /<resource>/import/``: the importable fields; ``POST``: upload a file.

        ``POST`` (multipart ``file``, optional ``mapping``) creates an import
        job and answers with its state — the file's columns and the mapping
        suggested from the headers or remembered from the user's last
        import. Preview it (the mandatory dry run) before committing.
      tags:
      - trials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDescribe'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.trial:add
        - can:
          - intel.trial:change
    post:
      operationId: trials_import_create
      description: |-
        ``GET /<resource>/import/``: the importable fields; ``POST``: upload a file.

        ``POST`` (multipart ``file``, optional ``mapping``) creates an import
        job and answers with its state — the file's columns and the mapping
        suggested from the headers or remembered from the user's last
        import. Preview it (the mandatory dry run) before committing.
      tags:
      - trials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.trial:add
        - can:
          - intel.trial:change
  /api/trials/import/{job}/:
    get:
      operationId: trials_import_by_job_retrieve
      description: '``GET /<resource>/import/<job>/``: the job''s state and progress.'
      parameters:
      - in: path
        name: job
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - trials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.trial:add
        - can:
          - intel.trial:change
  /api/trials/import/{job}/commit/:
    post:
      operationId: trials_import_commit_create
      description: '``POST /<resource>/import/<job>/commit/``: write it, after a preview,
        atomically.'
      parameters:
      - in: path
        name: job
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - trials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.trial:add
        - can:
          - intel.trial:change
  /api/trials/import/{job}/preview/:
    post:
      operationId: trials_import_preview_create
      description: |-
        ``POST /<resource>/import/<job>/preview/``: the dry run, with ``{"mapping": …}``.

        ``"match_ids": true`` matches existing rows by the file's id column, and
        ``"keep_ids": true`` creates rows with the file's ids (both off by default).

        Every row is validated and written inside a transaction that is
        rolled back, so the counts and the per-row errors are exactly what
        the commit will do. Large files run in Celery: poll the job.
      parameters:
      - in: path
        name: job
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - trials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.trial:add
        - can:
          - intel.trial:change
  /api/trials/import/template/:
    get:
      operationId: trials_import_template_retrieve
      description: '``GET /<resource>/import/template/``: headers, an example row,
        the allowed values.'
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - xlsx
        description: File format (csv by default for an export, xlsx for a template).
      tags:
      - trials
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
      x-karni-access:
        can:
        - intel.trial:view
components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - restore
      - transition
      type: string
      description: |-
        * `create` - Created
        * `update` - Updated
        * `delete` - Deleted
        * `restore` - Restored
        * `transition` - Transitioned
    Actor:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
      required:
      - email
      - id
    AggregateCategory:
      type: object
      description: Experimental. One group of the first dimension (a bar, a point
        on the x axis).
      properties:
        key:
          nullable: true
          description: 'The group''s key: a value, a related row''s key, or a date
            bucket (2024-Q1). null for rows with no value, and for Other.'
        label:
          type: string
          description: What the group is called.
        other:
          type: boolean
          description: True for the Other group that top adds.
      required:
      - key
      - label
      - other
    AggregateResult:
      type: object
      description: Experimental. The response of ``GET <resource>/aggregate/``.
      properties:
        group_by:
          type: string
        metric:
          $ref: '#/components/schemas/MetricEnum'
        value:
          type: string
          nullable: true
        split:
          type: string
          nullable: true
          description: The second dimension (stack or series), or null.
        stacked:
          type: boolean
          description: True when the second dimension came as stack.
        top:
          type: integer
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AggregateCategory'
        series:
          type: array
          items:
            $ref: '#/components/schemas/AggregateSeries'
      required:
      - categories
      - group_by
      - metric
      - series
      - split
      - stacked
      - top
      - value
    AggregateSeries:
      type: object
      description: 'Experimental. One series: a value per category, in the categories''
        order.'
      properties:
        key:
          nullable: true
          description: The second dimension's key, null without one.
        label:
          type: string
          description: What the series is called.
        values:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: A value per category. null where a metric has no value.
      required:
      - key
      - label
      - values
    BulkGrantRequest:
      type: object
      description: 'The ``bulk/`` body: one pattern and scope for every user listed
        (at most 1000).'
      properties:
        users:
          type: array
          items:
            type: string
            format: uuid
        permission:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
          default: all
        targets:
          type: array
          items:
            type: string
            minLength: 1
        expires_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - permission
      - users
    ChangeLog:
      type: object
      description: |-
        One change: when, by whom, what kind, and the fields that changed.

        ``diff`` is ``{field: [old, new]}`` minus the fields ``Karni.field_roles``
        hides from the requesting user (P3), so history never shows a value the
        row itself would not.
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        diff:
          type: object
          additionalProperties: {}
          readOnly: true
        fields_changed:
          type: array
          items:
            type: string
          readOnly: true
        batch:
          type: integer
          readOnly: true
          nullable: true
      required:
      - action
      - actor
      - batch
      - diff
      - fields_changed
      - id
      - timestamp
