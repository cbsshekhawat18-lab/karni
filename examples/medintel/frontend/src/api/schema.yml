          type: string
          format: date-time
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - in: query
        name: enrollment
        schema:
          type: integer
      - in: query
        name: enrollment__gte
        schema:
          type: integer
      - in: query
        name: enrollment__lte
        schema:
          type: integer
      - in: query
        name: group_by
