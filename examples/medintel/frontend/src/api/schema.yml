          - sponsor__name
          - start_year
          - status
        description: 'What to group by: a declared field, relation path or expression.
          A date takes :year, :quarter or :month.'
        required: true
      - in: query
        name: interventions
        schema:
          type: string
      - in: query
        name: interventions_descendants
        schema:
          type: boolean
        description: 'true: also the rows tagged with a node below those of ?interventions=.'
      - in: query
        name: investigator
