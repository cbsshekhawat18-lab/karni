    PatchedMeRequest:
      type: object
      description: |-
        The authenticated user's profile — the payload of ``me/`` and login.

        Only the safe fields ``first_name`` / ``last_name`` are writable (the
        ``me/`` PATCH surface); ``email`` changes exclusively through the
        email-change flow and everything else is audit data. ``roles`` (amendment
        A15) lists the user's Django group names via
        :func:`karni.accounts.permissions.user_roles` — the ``@karni/ui``
        ``usePermission`` hook consumes it.

        Override / escape hatch: subclass and redeclare ``Meta.fields`` to expose
        extra fields of a swapped user model, then point a subclassed view (or
        ``KARNI_ACCOUNTS_AUTO_LOGIN`` consumers) at your serializer.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PatchedUserGrantRequest:
      type: object
      description: One grant. ``user`` is set once, ``granted_by`` and ``active``
        are read-only.
      properties:
        user:
          type: string
          format: uuid
        permission:
          type: string
          minLength: 1
          description: 'A KARNI_ROLES pattern: app_label.model:action, with * for
            either part.'
          maxLength: 200
        scope:
          type: string
          minLength: 1
          description: all, own, related:<scope path key>, custom:<registered name>
            or tree:<path to a tree model>.
          maxLength: 120
        targets:
          type: array
          items:
            type: string
            minLength: 1
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 'Empty: the grant never expires.'
        reason:
          type: string
          maxLength: 255
    PhaseEnum:
      enum:
      - phase_1
      - phase_2
      - phase_3
      - phase_4
      type: string
      description: |-
        * `phase_1` - Phase 1
        * `phase_2` - Phase 2
        * `phase_3` - Phase 3
        * `phase_4` - Phase 4
    Register:
      type: object
      description: |-
        Input for ``register/``: email, password and the optional name fields.

        Uniqueness is checked here — a duplicate email is a 400, the documented
        and accepted enumeration surface of registration (amendment A9). The
        password runs through ``AUTH_PASSWORD_VALIDATORS`` against a transient
        user instance so similarity validators see the posted attributes.
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
      required:
      - email
    RegisterRequest:
      type: object
      description: |-
        Input for ``register/``: email, password and the optional name fields.

        Uniqueness is checked here — a duplicate email is a 400, the documented
        and accepted enumeration surface of registration (amendment A9). The
        password runs through ``AUTH_PASSWORD_VALIDATORS`` against a transient
        user instance so similarity validators see the posted attributes.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
      required:
      - email
      - password
    SocialNameRequest:
      type: object
      description: 'Experimental. The optional ``name`` of ``social/<provider>/``:
        Apple''s first sign-in.'
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    SocialTokenLoginRequest:
      type: object
      description: |-
        Experimental. Request body of ``social/<provider>/``: the ID token, a nonce and a name.

        ``nonce`` is the raw value the app generated for this sign-in (the token
        carries it, or its SHA-256 hex digest). ``name`` is used only when the
        token creates an account and carries no name itself, which is what Apple
        does: it sends the name to the app once, on the first sign-in.
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
        nonce:
          type: string
          maxLength: 512
        name:
          allOf:
          - $ref: '#/components/schemas/SocialNameRequest'
          nullable: true
      required:
      - id_token
    StatusEnum:
      enum:
      - recruiting
      - active
      - completed
      - terminated
      type: string
      description: |-
        * `recruiting` - Recruiting
        * `active` - Active
        * `completed` - Completed
        * `terminated` - Terminated
    TermsAcceptRequest:
      type: object
      description: |-
        Experimental. Request body of ``terms/accept/``: the version shown, and the client.

        ``version`` is the version the user read and accepted. ``client`` is an
        optional JSON object the app sends about itself (a mobile app's device,
        platform and app version, for example), stored with the acceptance. It
        may be at most ``CLIENT_MAX_BYTES`` bytes of JSON.
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 100
        client:
          nullable: true
      required:
      - version
    TermsStatus:
      type: object
      description: |-
        Experimental. The answer of ``terms/`` and ``terms/accept/``.

        ``accepted_at`` is when the user accepted ``version``, ``null`` when they
        have not. While ``required`` is true and ``accepted`` false, the API
        refuses the user with ``E245``.
      properties:
        version:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        required:
          type: boolean
          readOnly: true
        accepted:
          type: boolean
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted
      - accepted_at
      - required
      - url
      - version
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserGrant:
