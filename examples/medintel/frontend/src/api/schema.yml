      description: |-
        ``GET /<resource>/import/``: the importable fields; ``POST``: upload a file.

        ``POST`` (multipart ``file``, optional ``mapping``) creates an import
        job and answers with its state — the file's columns and the mapping
        suggested from the headers or remembered from the user's last
        import. Preview it (the mandatory dry run) before committing.
      tags:
      - companies
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDescribe'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.company:add
        - can:
          - intel.company:change
    post:
      operationId: companies_import_create
      description: |-
        ``GET /<resource>/import/``: the importable fields; ``POST``: upload a file.

        ``POST`` (multipart ``file``, optional ``mapping``) creates an import
        job and answers with its state — the file's columns and the mapping
        suggested from the headers or remembered from the user's last
        import. Preview it (the mandatory dry run) before committing.
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.company:add
        - can:
          - intel.company:change
