openapi: 3.0.3
info:
  title: medintel API
  version: 0.1.0
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        ``GET csrf/`` — CSRF cookie bootstrap for SPAs (amendment A4).

        Returns 204 with the CSRF cookie set; a session-mode SPA calls this once
        before its first credentialed POST and sends the cookie's value back in
        the ``X-CSRFToken`` header. Harmless (and unnecessary) in JWT mode.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/email/change/:
    post:
      operationId: auth_email_change_create
      description: |-
        ``POST email/change/`` ``{new_email, current_password}`` — start the flow.

        Auth plus the current password; the confirmation link is emailed to the
        *new* address (clicking it proves ownership). A taken address is a 400
        here and re-checked at confirm time (services layer, amendments A7/A9).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChange'
          description: ''
  /api/auth/email/change/confirm/:
    post:
      operationId: auth_email_change_confirm_create
      description: |-
        ``POST email/change/confirm/`` ``{token}`` — finish the email change.

        Anonymous on purpose: the emailed link lands on a frontend page without a
        session. A uniqueness race between request and confirm surfaces as a 400
        (``TokenError("invalid")``), never a 500 (amendment A7).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: '``POST email/verify/`` ``{token}`` — confirm ownership of the
        address.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OneTimeTokenRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/email/verify/resend/:
    post:
      operationId: auth_email_verify_resend_create
      description: |-
        ``POST email/verify/resend/`` — email a fresh verification link.

        Auth required, so it may answer honestly (amendment A9): an
        already-verified account gets a 200 saying so instead of pointless mail.
        Reissuing invalidates the previously emailed link (single active token
        per purpose).
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        ``POST login/`` — authenticate with email and password (both modes).

        JWT mode → ``{"access", "refresh", "user"}``; session mode → Django
        session plus ``{"user"}``. When the account has confirmed 2FA the
        response is the gate payload (``requires_2fa`` + ``ephemeral_token``) and
        *no* credentials — see :func:`_twofa_gate_payload`. ``ensure_csrf_cookie``
        guarantees SPAs a CSRF cookie from the very first auth call (amendment
        A4); the per-account throttle rides alongside the per-IP one (A5).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        ``POST logout/`` — end the current credential.

        JWT mode blacklists the posted refresh token (the short-lived access
        token expires on its own — by design, amendment A1's documented window);
        session mode flushes the Django session. 204 on success.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        ``GET``/``PATCH me/`` — the authenticated user's profile.

        PATCH accepts only the safe fields (``first_name`` / ``last_name``);
        everything else in :class:`MeSerializer` is read-only, and read-only
        fields in a payload are ignored, not errors. PUT is deliberately absent —
        the profile is never wholly replaced through this endpoint.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        ``GET``/``PATCH me/`` — the authenticated user's profile.

        PATCH accepts only the safe fields (``first_name`` / ``last_name``);
        everything else in :class:`MeSerializer` is read-only, and read-only
        fields in a payload are ignored, not errors. PUT is deliberately absent —
        the profile is never wholly replaced through this endpoint.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/otp/send/:
    post:
      operationId: auth_otp_send_create
      description: |-
        Experimental. ``POST otp/send/`` ``{email}``: email a sign-in code, enumeration-silent.

        Always the same 200 and the same body (:func:`karni.accounts.otp.send_answer`:
        ``{"detail", "length", "expires_in"}``), whether the address has an
        account, is inactive, or may not sign up. :func:`karni.accounts.otp.send_code`
        does the same work on every path and sends the email after the
        transaction commits. A malformed address is a plain 400. While
        ``KARNI_EMAIL_OTP`` is off the route is not mounted, and a URLconf built
        earlier answers 404 ``E236``.

        Throttled per IP (``auth.otp_send``) and per address
        (``auth.otp_send_email``). Override / escape hatch: subclass and declare
        ``path("api/auth/otp/send/", ...)`` before the include, or change
        ``throttle_classes`` / ``throttle_scope``.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: |-
        Experimental. ``POST otp/verify/`` ``{email, code}``: sign in with the emailed code.

        The answer is the one ``login/`` gives: ``{"access", "refresh", "user"}``
        in JWT mode, a session plus ``{"user"}`` in session mode, or the 2FA gate
        payload (:func:`_twofa_gate_payload`). A refused code is a 401 ``E235``
        whatever went wrong (wrong, expired, used, locked, or an address nobody
        sent a code to), an inactive account a 401 ``E226`` after a right code,
        and a new account under the ``approval`` policy a 202 ``E224`` with no
        credentials. Refusals are returned, not raised, so a guess spent on a
        wrong code stays spent even with ``ATOMIC_REQUESTS``.

        Throttled per IP (``auth.otp_verify``), on top of the attempt cap of each
        code. Override / escape hatch: subclass and declare
        ``path("api/auth/otp/verify/", ...)`` before the include.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        ``POST password/change/`` — rotate the password (auth required).

        Requires the current password. On success every outstanding refresh token
        is blacklisted (amendment A1 — stolen refresh tokens die with the old
        credential; access tokens live out their short lifetime by design), and in
        session mode ``update_session_auth_hash`` keeps the changer's own session
        alive while every other session's auth hash goes stale.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        ``POST password/reset/`` — request a reset link, enumeration-silent.

        Always 200 with the same body whether or not the address has an account
        (amendment A9): the only reset endpoint that must never reveal existence.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
          description: ''
  /api/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        ``POST password/reset/confirm/`` — set a new password via the link.

        Token consumption, password validation and the amendment-A1 refresh-token
        blacklisting all happen atomically in
        :func:`karni.accounts.services.confirm_password_reset`; a rejected
        password rolls back and leaves the token usable (amendment A7).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/permissions/effective/:
    get:
      operationId: auth_permissions_effective_retrieve
      description: '``GET permissions/effective/[<user id>/]`` — what a user may do,
        and why.'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/permissions/effective/{user_id}/:
    get:
      operationId: auth_permissions_effective_by_user_id_retrieve
      description: '``GET permissions/effective/[<user id>/]`` — what a user may do,
        and why.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/permissions/grants/:
    get:
      operationId: auth_permissions_grants_list
      description: '``GET``/``POST permissions/grants/``: the grants the requester
        may view, and a new one.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserGrantList'
          description: ''
    post:
      operationId: auth_permissions_grants_create
      description: '``GET``/``POST permissions/grants/``: the grants the requester
        may view, and a new one.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserGrantRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrant'
          description: ''
  /api/auth/permissions/grants/{id}/:
    get:
      operationId: auth_permissions_grants_by_id_retrieve
      description: |-
        ``GET``/``PATCH``/``DELETE permissions/grants/<id>/``: one grant, a change, a revoke.

        A grant outside the requester's view scope is a 404, one they may read
        but not change or delete a 403.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrant'
          description: ''
    patch:
      operationId: auth_permissions_grants_partial_by_id_update
      description: |-
        ``GET``/``PATCH``/``DELETE permissions/grants/<id>/``: one grant, a change, a revoke.

        A grant outside the requester's view scope is a 404, one they may read
        but not change or delete a 403.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserGrantRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrant'
          description: ''
    delete:
      operationId: auth_permissions_grants_by_id_destroy
      description: |-
        ``GET``/``PATCH``/``DELETE permissions/grants/<id>/``: one grant, a change, a revoke.

        A grant outside the requester's view scope is a 404, one they may read
        but not change or delete a 403.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/permissions/grants/bulk/:
    post:
      operationId: auth_permissions_grants_bulk_create
      description: '``POST permissions/grants/bulk/``: one pattern and scope to many
        users, all or none.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkGrantRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGrant'
          description: ''
  /api/auth/permissions/matrix/:
    get:
      operationId: auth_permissions_matrix_retrieve
      description: '``GET``/``POST permissions/matrix/`` — the matrix, and changes
        to it.'
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixChanges'
          description: ''
    post:
      operationId: auth_permissions_matrix_create
      description: '``GET``/``POST permissions/matrix/`` — the matrix, and changes
        to it.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrixChangesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MatrixChangesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MatrixChangesRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixChanges'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        ``POST refresh/`` — rotate a refresh token (JWT mode only).

        Session mode answers 405 from the view (amendment A3 — the URL exists in
        both modes): the session cookie is the credential there and renews
        itself. JWT mode delegates to SimpleJWT's ``TokenRefreshView``; with
        Karni's conf defaults refresh tokens rotate and the old one is
        blacklisted (``ROTATE_REFRESH_TOKENS`` / ``BLACKLIST_AFTER_ROTATION``).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        ``POST register/`` — create an account, 201 with the profile payload.

        The response body is the :class:`MeSerializer` payload of the new user.
        With ``KARNI_ACCOUNTS_AUTO_LOGIN = True`` (default ``False``) the response
        additionally carries ``access``/``refresh`` in JWT mode, or opens a
        session in session mode. The verification email goes out on transaction
        commit (amendment A7) through the configured accounts email backend.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/social/google/:
    post:
      operationId: auth_social_google_create
      description: |-
        Experimental. ``POST social/<provider>/``: sign in with a provider's ID token (both modes).

        The body is ``{"id_token", "nonce"?, "name"?}`` (see
        :class:`SocialTokenLoginSerializer`). The token is verified offline by
        :func:`karni.accounts.social_token.verify_id_token` and the account
        chosen by :func:`karni.accounts.social_token.sign_in`. The answer is the
        one ``login/`` gives: ``{"access", "refresh", "user"}`` in JWT mode, a
        session plus ``{"user"}`` in session mode, or the 2FA gate payload. A
        refusal is ``{"code", "detail"}`` with a 400 or 401 (404 ``E225`` for a
        provider that is not configured, 503 ``E219`` when its keys cannot be
        fetched), and a new account awaiting approval is a 202 with ``E224`` and
        no credentials.

        ``karni.accounts.urls`` mounts one route per configured provider and
        passes its name as ``provider``. Override / escape hatch: subclass and
        declare ``path("api/auth/social/<provider>/", ...)`` before the include,
        or set ``throttle_classes`` / ``throttle_scope`` (``auth.social``).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialTokenLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialTokenLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialTokenLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/terms/:
    get:
      operationId: auth_terms_retrieve
      description: |-
        Experimental. ``GET terms/``: the current terms, and whether the user accepted them.

        ``{"version", "url", "required", "accepted", "accepted_at"}``
        (:func:`karni.accounts.terms.status`). 401 without a signed-in user. The
        route exists while ``KARNI_TERMS`` is set, and a URLconf built earlier
        answers 404 ``E249`` once it is unset. The terms gate never refuses it.

        Override / escape hatch: subclass and declare ``path("api/auth/terms/",
        ...)`` before the include.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
