  /api/companies/import/{job}/preview/:
    post:
      operationId: companies_import_preview_create
      description: |-
        ``POST /<resource>/import/<job>/preview/``: the dry run, with ``{"mapping": …}``.

        ``"match_ids": true`` matches existing rows by the file's id column, and
        ``"keep_ids": true`` creates rows with the file's ids (both off by default).

        Every row is validated and written inside a transaction that is
        rolled back, so the counts and the per-row errors are exactly what
        the commit will do. Large files run in Celery: poll the job.
      parameters:
      - in: path
        name: job
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
      x-karni-access:
        any:
        - can:
          - intel.company:add
        - can:
          - intel.company:change
