  /api/deals/aggregate/:
    get:
      operationId: deals_aggregate_retrieve
      description: |-
        Experimental. Grouped counts, sums, averages, minimums and maximums of the list's rows.

        ``group_by`` names a declared field, relation path or expression (a date
        takes ``:year``, ``:quarter`` or ``:month``), ``metric`` one of count, sum,
        avg, min, max and distinct_count, ``value`` the declared field it reads,
        ``top`` keeps the largest groups and puts the rest in Other, and ``stack``
        or ``series`` adds a second dimension. Every list filter and ``search``
        apply, after access.
      parameters:
      - in: query
        name: acquirer
        schema:
          type: string
          format: uuid
      - in: query
        name: brand
        schema:
          type: string
          format: uuid
      - in: query
        name: created_at
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - acquirer__name
          - year
        description: 'What to group by: a declared field, relation path or expression.
          A date takes :year, :quarter or :month.'
        required: true
      - in: query
        name: interventions
        schema:
          type: string
      - in: query
        name: interventions_descendants
        schema:
          type: boolean
        description: 'true: also the rows tagged with a node below those of ?interventions=.'
      - in: query
        name: metric
        schema:
          type: string
          enum:
          - avg
          - count
          - sum
        description: What to compute per group (default count).
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: seller
        schema:
          type: string
          format: uuid
      - in: query
        name: series
        schema:
          type: string
          enum:
          - acquirer__name
          - year
        description: A second dimension, as separate series.
      - in: query
        name: stack
        schema:
          type: string
          enum:
          - acquirer__name
          - year
        description: A second dimension, stacked.
      - in: query
        name: title
        schema:
          type: string
      - in: query
        name: title__icontains
        schema:
          type: string
      - in: query
        name: top
        schema:
          type: integer
        description: Keep the N largest groups and put the rest in one Other group.
      - in: query
        name: updated_at
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_at__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_at__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_by
        schema:
          type: string
          format: uuid
      - in: query
        name: value
        schema:
          type: string
          enum:
          - value
        description: The declared field the metric reads (not needed for count).
      - in: query
        name: value__gte
        schema:
          type: number
      - in: query
        name: value__lte
        schema:
          type: number
      - in: query
        name: year
        schema:
          type: integer
      - in: query
        name: year__gte
        schema:
          type: integer
      - in: query
        name: year__lte
        schema:
          type: integer
      tags:
      - deals
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateResult'
          description: ''
      x-karni-access:
        can:
        - intel.deal:view
      x-karni-aggregate:
        group_by:
        - year
        - acquirer__name
        values:
        - value
        metrics:
        - count
        - sum
        - avg
