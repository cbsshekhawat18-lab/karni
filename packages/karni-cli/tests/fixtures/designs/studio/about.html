<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The studio — Atelier Nord</title>
  <meta name="description" content="Who works at Atelier Nord and how we work.">
  <link rel="stylesheet" href="css/studio.css">
  <script src="js/studio.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="topbar__logo" href="index.html">Atelier Nord</a>
    <nav><a href="index.html">Work</a> <a href="about.html" class="is-here">Studio</a></nav>
  </header>

  <!-- PAGE HERO -->
  <section class="page-hero" data-slider>
    <div class="page-hero__slides">
      <img class="is-shown" src="img/about-1.jpg" alt="" data-caption="The studio in winter">
      <img src="img/about-2.jpg" alt="" data-caption="Models on the long table">
    </div>
    <h1>The studio</h1>
  </section>

  <!-- FOUNDER -->
  <section class="founder">
    <div class="founder__card">
      <img src="img/ola.jpg" alt="Ola Nord in the workshop">
      <h2>Ola Nord</h2>
      <p class="member__role">Founder, architect</p>
      <p>Ola started the studio after ten years of building boats.</p>
      <ul class="founder__awards">
        <li>Wood award 2021</li>
        <li>Town prize 2019</li>
      </ul>
    </div>
  </section>

  <!-- TEAM -->
  <section class="people">
    <h2>Who we are</h2>
    <div class="people__grid">
      <article class="member">
        <img src="img/ines.jpg" alt="Ines Aalto">
        <h3>Ines Aalto</h3>
        <p class="member__role">Architect, founder</p>
      </article>
      <article class="member">
        <img src="img/theo.jpg" alt="Theo Brandt">
        <h3>Theo Brandt</h3>
        <p class="member__role">Architect</p>
      </article>
      <article class="member">
        <img src="img/yara.jpg" alt="Yara Saleh">
        <h3>Yara Saleh</h3>
        <p class="member__role">Interior designer</p>
      </article>
    </div>
  </section>

  <footer class="bottombar"><p>Atelier Nord &middot; <a href="about.html">The studio</a></p></footer>
</body>
</html>
