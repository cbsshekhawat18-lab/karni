<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Maison Brioche</title>
  <meta name="description" content="Opening hours, address and a form for orders.">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Maison Brioche</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Contact</h1>
    <p>Open Tuesday to Sunday, 7:00 to 19:00.</p>
    <form action="https://forms.example.com/brioche" method="post">
      <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name"></div>
      <div class="mb-3"><label class="form-label" for="order">Order</label><input class="form-control" id="order" name="order"></div>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container"><small>Maison Brioche &middot; 3 rue du Four &middot; <a class="text-white" href="contact.html">Contact</a></small></div>
  </footer>
</body>
</html>
