<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admissions | Hillside School</title>
  <meta name="description" content="Ask about a place for your child.">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/school.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="index.html">Hillside School</a>
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link active" aria-current="page" href="admissions.html">Admissions</a>
  </nav>
  <main class="container">
    <h1>Admissions</h1>
    <form id="enquiry" action="https://forms.example.org/hillside" method="post">
      <div class="row">
        <div class="col-md mb-3">
          <label for="parent" class="form-label">Your name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="parent" name="parent_name" required>
        </div>
        <div class="col-md mb-3">
          <label for="mail" class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="mail" name="email" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="grade" class="form-label">Year group</label>
        <select class="form-select" id="grade" name="year_group">
          <option value="reception">Reception</option>
          <option value="year-1">Year 1</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="msg" class="form-label">Message</label>
        <textarea class="form-control" id="msg" name="message" rows="4"></textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="visit" name="visit">
        <label class="form-check-label" for="visit">We would like to visit</label>
      </div>
      <button type="submit" class="btn btn-primary">Send enquiry</button>
    </form>
  </main>
  <footer class="footer">
    <form class="row g-2" action="#" method="post">
      <div class="col-auto">
        <label class="visually-hidden" for="nl-email">Email</label>
        <input type="email" class="form-control" id="nl-email" name="email" placeholder="Your email" required>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" type="submit">Subscribe</button>
      </div>
    </form>
  </footer>
</body>
</html>
