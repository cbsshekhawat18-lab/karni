[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-cli"
version = "0.3.1"
description = "The karni command for the Karni Django + React framework: scaffold a project, generate models, viewsets and pages, run it, upgrade it across releases, and give AI coding agents its context, rules and error explanations."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 licence expression; no "License ::" classifier (deprecated alongside it).
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chandrabhan Shekhawat", email = "cbsshekhawat18@gmail.com" }]
keywords = [
    "django",
    "react",
    "cli",
    "scaffolding",
    "code-generation",
    "project-template",
    "cookiecutter",
    "ai-agents",
    "claude-code",
    "cursor",
    "copilot",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "cookiecutter>=2.5",
    "tomlkit>=0.12",
    "packaging>=24.0",
    "pyyaml>=6.0",
    # `karni upgrade`'s Python codemods. A hard dependency, not an extra: the
    # upgrade must work on the first try for a user on an old release, and it
    # is imported only by that command (prebuilt wheels for every platform).
    "libcst>=1.4",
]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"
Changelog = "https://github.com/cbsshekhawat18-lab/karni/tree/main/docs/migrations"

[project.optional-dependencies]
# `karni mcp`: the official MCP Python SDK (MCPServer in 2.x, FastMCP in 1.x).
mcp = ["mcp>=1.2"]

[project.scripts]
karni = "karni_cli.main:run"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["karni_cli"]
artifacts = [
    "karni_cli/_templates/",
    "karni_cli/_agent/",
    "karni_cli/_changelog/",
    "karni_cli/_errorcodes/",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "karni_cli/_templates/",
    "karni_cli/_agent/",
    "karni_cli/_changelog/",
    "karni_cli/_errorcodes/",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["karni_cli/_templates"]

[tool.ruff.lint]
# B008: typer's documented pattern puts typer.Option() in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
