[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-cli"
version = "0.1.0"
description = "The karni command: scaffold, wire, introspect and upgrade Karni projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "cookiecutter>=2.5",
    "tomlkit>=0.12",
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
karni = "karni_cli.main:run"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["karni_cli"]
artifacts = ["karni_cli/_templates/"]

[tool.hatch.build.targets.sdist]
artifacts = ["karni_cli/_templates/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["karni_cli/_templates"]

[tool.ruff.lint]
# B008: typer's documented pattern puts typer.Option() in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
