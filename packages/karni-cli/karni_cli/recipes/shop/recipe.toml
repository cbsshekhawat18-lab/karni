name = "shop"
title = "Online shop"
purpose = "Products in categories, a cart, orders and checkout with online payments."
use_when = [
    "online shop",
    "online store",
    "ecommerce",
    "sell products",
    "shopping cart",
    "checkout",
    "orders",
]
usually_changed = [
    "the product fields",
    "the payment provider and the currency",
    "the parcel states",
    "the terms version and url",
]

# The shop's pages (files/frontend/src/pages/): the first karni build registers each in
# frontend/src/routes.tsx. The storefront is under /shop. /cart, /checkout, /orders,
# /account and /signin are the family pages: thin files that mount @karni/commerce-ui's
# and @karni/ui's components. area = "store" puts a page in the storefront's own header
# and footer (files/frontend/src/layout.tsx).

[[routes]]
path = "/shop"
page = "pages/shop/index"
public = true
data = { area = "store" }

[[routes]]
path = "/shop/products"
page = "pages/shop/products"
public = true
data = { area = "store" }

[[routes]]
path = "/shop/products/$slug"
page = "pages/shop/product"
public = true
data = { area = "store" }

[[routes]]
path = "/cart"
page = "pages/cart"
public = true
data = { area = "store" }

[[routes]]
path = "/checkout"
page = "pages/checkout"
public = true
data = { area = "store" }

[[routes]]
path = "/orders"
page = "pages/orders"
data = { area = "store" }

[[routes]]
path = "/orders/$number"
page = "pages/order"
public = true
data = { area = "store" }

[[routes]]
path = "/account"
page = "pages/account"
data = { area = "store" }

[[routes]]
path = "/signin"
page = "pages/signin"
public = true
data = { area = "store" }

[[routes]]
path = "/terms"
page = "pages/terms"
public = true
data = { area = "store" }
