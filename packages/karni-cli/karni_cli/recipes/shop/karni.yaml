# yaml-language-server: $schema=https://cbsshekhawat18-lab.github.io/karni/assets/karni-spec.schema.json
version: 1
app:
  name: Shop
  kind: app
  recipe: shop
modules:
  # KARNI_PAYMENTS_PROVIDER in the environment wins over `provider`, so .env switches a
  # local try or a demo to `test` with no code edit.
  payments:
    provider: stripe
    currency: usd
    checkout_validator: karni_commerce.payments.checkout_validator
  commerce: {hold_minutes: 30}
features:
  email_code_login: true
  terms: {version: "2026-01", url: /terms, required: true, paths: [/api/carts/current/checkout/]}
roles:
  admin: {name: Admin, system: true, grants: {"*": all}}
  shop-manager:
    name: Shop manager
    description: The whole shop, refunds included.
    grants:
      "shop.*": all
      "karni_commerce.*": all
      "karni_payments.*": all
  shop-staff:
    name: Shop staff
    description: Orders, shipments and the catalogue.
    grants:
      "shop.*": all
      "karni_commerce.order:view": all
      "karni_commerce.order:change": all
      "karni_commerce.order:add": all
      "karni_commerce.orderline:view": all
      "karni_commerce.orderpayment:view": all
      "karni_commerce.orderrefund:view": all
      "karni_commerce.cart:view": all
      "karni_commerce.cartline:view": all
      "karni_payments.payment:view": all
  customer:
    name: Customer
    default: true
    grants: {}
apps:
  shop:
    entities:
      Category:
        fields: {name: "str:120", slug: "slug:name", description: "text?", image: "image?"}
        tree: true
        key: slug
        search: [name]
        order: name
        access: {read: public, write: granted}
      Tag:
        fields: {name: "str:60", slug: "slug:name"}
        key: slug
        search: [name]
        order: name
        access: {read: public, write: granted}
      Product:
        fields:
          name: "str:200"
          slug: "slug:name"
          sku: "str:64"
          short_description: "str:300?"
          description: "text?"
          image: "image?"
          price: "money:USD"
          sale_price: "money:USD?"
          sale_starts: "datetime?"
          sale_ends: "datetime?"
          stock: int
          available: "capacity:stock"
          low_stock: "int?"
          backorders: bool
          active: bool
          featured: bool
          tags: "m2m:Tag?"
        taxonomies: {categories: Category}
        key: slug
        search: [name, sku, short_description, description]
        global_search: {fields: [name, sku], title: name, subtitle: sku}
        order: name
        groups:
          Product: [name, slug, sku, short_description, description, image, active, featured, tags]
          Price: [price, sale_price, sale_starts, sale_ends]
          Inventory: [stock, available, low_stock, backorders]
        access: {read: public, write: granted}
      ProductImage:
        fields: {product: fk:Product, image: image, alt: "str:200?", position: int}
        order: [product, position]
        access: {read: public, write: granted}
      Shipment:
        fields:
          order: fk:karni_commerce.Order
          status: "state:processing>shipped|processing>cancelled|shipped>delivered"
          carrier: "str:80?"
          tracking_number: "str:80?"
          shipped_at: "datetime?"
          delivered_at: "datetime?"
        audit: [status]
        search: [tracking_number]
        order: -created_at
        access: {read: granted, write: granted}
pages:
  - home: dashboard
  - Shipment: [list, detail, form]
  - Product: [list, {detail: {related: [ProductImage]}}, form]
  - Category: [list, form]
  - Tag: [list, form]
  # The pages of the recipe's own files (recipe.toml [[routes]]): the storefront and the
  # family pages, each a code page of the project.
  - shop: code
  - cart: code
  - checkout: code
  - orders: code
  - customers: code
  - account: code
  - signin: code
  - terms: code
navigation:
  - home: {label: Dashboard, icon: dashboard, requires: "karni_commerce.order:view"}
  - orders: {label: Orders, icon: list, requires: "karni_commerce.order:view"}
  - Shipment: {label: Shipments, icon: box, requires: "shop.shipment:change"}
  - customers: {label: Customers, icon: users, requires: "karni_commerce.order:view"}
  - Catalogue: {icon: tag, requires: "shop.product:change", items: [Product, Category, Tag]}
# The staff home: each tile shows to the roles that may read what it counts. The shop's
# own figures are code tiles in shop/dashboard.py (stock running low, best sellers), and
# karni-commerce gives the revenue ones (commerce.revenue, commerce.revenue_chart,
# commerce.latest_orders).
dashboard:
  - {key: shop.to_send, title: Orders to fulfil, kind: stat, entity: Shipment,
     filters: {status: processing}, link: "/shipments?shipments.status=processing",
     description: "Paid, waiting to be sent", order: 1}
  - {key: shop.in_transit, title: On their way, kind: stat, entity: Shipment,
     filters: {status: shipped}, link: "/shipments?shipments.status=shipped", order: 2}
  - {key: shop.sold_out, title: Sold out, kind: stat, entity: Product,
     filters: {available__lte: 0, active: true}, requires: "shop.product:change",
     link: "/products?products.available__lte=0", order: 3}
  - {key: commerce.revenue, order: 5}
  - {key: commerce.revenue_chart, order: 6}
  - {key: commerce.latest_orders, order: 7}
seed: {Category: 15, Tag: 8, Product: 40, ProductImage: 60, Shipment: 20}
