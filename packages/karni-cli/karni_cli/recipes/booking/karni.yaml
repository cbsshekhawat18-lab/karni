# yaml-language-server: $schema=https://cbsshekhawat18-lab.github.io/karni/assets/karni-spec.schema.json
version: 1
app:
  name: Booking
  kind: app
  currency: USD
modules:
  payments: {provider: stripe, currency: usd}
features:
  email_code_login: true
roles:
  admin: {name: Admin, description: "Everything, users and roles too.", system: true, grants: {"*": all}}
  bookings-staff:
    name: Staff
    description: Runs the resources, the slots and every booking.
    grants: {"bookings.*": all}
  customer:
    name: Member
    description: Books slots and pays for them.
    default: true
    grants: {bookings.booking: own}
apps:
  bookings:
    entities:
      Resource:
        fields:
          name: "str:120"
          slug: "slug:name"
          description: "text?"
          price: money
        key: slug
        search: [name]
        order: name
        bounds: {price: {min: 0}}
        delete: {blocked_by: [Slot]}
        access: {read: public, write: ["role:bookings-staff", "role:admin"]}
      Slot:
        fields:
          resource: fk:Resource
          starts_at: datetime
          ends_at: datetime
          capacity: int
          remaining: "capacity:capacity"
        order: starts_at
        bounds: {capacity: {min: 1}, starts_at: {min: $now}}
        delete: {blocked_by: {Booking: {status: {not: cancelled}}}}
        access: {read: public, write: ["role:bookings-staff", "role:admin"]}
      Booking:
        fields:
          slot: fk:Slot
          member: fk:User
          status: "state:pending>confirmed|pending>cancelled|confirmed>cancelled"
          note: "text?"
          payment: "fk:karni_payments.Payment?"
        owner: member
        audit: [status]
        order: -created_at
        unique: [{fields: [slot, member], where: {status: {not: cancelled}}}]
        targets: {slot: {starts_at__gt: $now}}
        frozen: {slot: true}
        moves: {confirmed: {notify: member}, cancelled: {notify: member}}
        actions:
          pay: {from: pending, by: "owned:member"}
          cancel:
            from: [pending, confirmed]
            to: cancelled
            by: ["owned:member", "role:bookings-staff", "role:admin"]
          confirm: {from: pending, to: confirmed, by: ["role:bookings-staff", "role:admin"]}
        access:
          read: ["owned:member", "role:bookings-staff", "role:admin"]
          write: ["owned:member", "role:bookings-staff", "role:admin"]
          delete: ["role:bookings-staff", "role:admin"]
          assign: ["role:bookings-staff", "role:admin"]
pages:
  - Resource: [list, detail, form]
  - Slot: [list, form]
  - Booking: [list, detail]
seed: {Resource: 4, Slot: 30, Booking: 60}
