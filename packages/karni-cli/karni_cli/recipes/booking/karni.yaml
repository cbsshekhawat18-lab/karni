# yaml-language-server: $schema=https://cbsshekhawat18-lab.github.io/karni/assets/karni-spec.schema.json
version: 1
app:
  name: Booking
  kind: app
  recipe: booking
modules:
  payments: {provider: stripe, currency: usd}
features:
  email_code_login: true
roles:
  staff: {name: Staff, system: true, grants: {"*": all}}
  member: {name: Member, default: true, grants: {bookings.booking: own}}
apps:
  bookings:
    entities:
      Resource:
        fields:
          name: "str:120"
          slug: "slug:name"
          description: "text?"
          price: "money:USD"
        key: slug
        search: [name]
        order: name
        bounds: {price: {min: 0}}
        delete: {blocked_by: [Slot]}
        access: {read: public, write: "role:staff"}
      Slot:
        fields:
          resource: fk:Resource
          starts_at: datetime
          ends_at: datetime
          capacity: int
          remaining: "capacity:capacity"
        order: starts_at
        bounds: {capacity: {min: 1}, starts_at: {min: $now}}
        delete: {blocked_by: {Booking: {status: {not: cancelled}}}}
        access: {read: public, write: "role:staff"}
      Booking:
        fields:
          slot: fk:Slot
          member: fk:User
          status: "state:pending>confirmed|pending>cancelled|confirmed>cancelled"
          note: "text?"
          payment: "fk:karni_payments.Payment?"
        owner: member
        audit: [status]
        order: -created_at
        unique: [{fields: [slot, member], where: {status: {not: cancelled}}}]
        targets: {slot: {starts_at__gt: $now}}
        frozen: {slot: true}
        moves: {confirmed: {notify: member}, cancelled: {notify: member}}
        actions:
          pay: {from: pending, by: "owned:member"}
          cancel: {from: [pending, confirmed], to: cancelled, by: ["owned:member", "role:staff"]}
          confirm: {from: pending, to: confirmed, by: "role:staff"}
        access:
          read: ["owned:member", "role:staff"]
          write: ["owned:member", "role:staff"]
          delete: "role:staff"
          assign: "role:staff"
pages:
  - home: dashboard
  - Resource: [list, detail, form]
  - Slot: [list, form]
  - Booking: [list, detail]
seed: {Resource: 4, Slot: 30, Booking: 60}
