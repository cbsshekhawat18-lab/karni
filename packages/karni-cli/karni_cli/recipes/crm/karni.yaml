# yaml-language-server: $schema=https://cbsshekhawat18-lab.github.io/karni/assets/karni-spec.schema.json
version: 1
app:
  name: CRM
  kind: app
  currency: USD
features:
  two_factor: true
roles:
  admin: {name: Admin, description: "Everything, users and roles too.", system: true, grants: {"*": all}}
  crm-manager:
    name: Manager
    description: Sees and changes every deal and activity.
    default: false
    grants: {"crm.*": all}
  crm-rep:
    name: Sales
    description: Works their own deals and activities, and every company and contact.
    default: false
    grants: {crm.company: all, crm.contact: all, crm.deal: own, crm.activity: own}
apps:
  crm:
    entities:
      Company:
        fields:
          name: "str:200"
          website: "url?"
          industry: "str:80?"
          phone: "phone?"
          notes: "text?"
        key: name
        search: [name, industry]
        order: name
        audit: true
        unique: [[name]]
        delete: {blocked_by: [Contact, Deal]}
        access: {read: granted, write: granted}
      Contact:
        fields:
          company: "fk:Company?"
          first_name: "str:80"
          last_name: "str:80"
          email: "email:unique"
          phone: "phone?"
          title: "str:120?"
        key: email
        search: [first_name, last_name, email]
        order: [last_name, first_name]
        audit: true
        delete: {blocked_by: [Deal]}
        access: {read: granted, write: granted}
      Deal:
        fields:
          company: fk:Company
          contact: "fk:Contact?"
          title: "str:200"
          value: money
          salesperson: fk:User
          stage: "state:lead>qualified|lead>lost|qualified>proposal|qualified>lost|proposal>won|proposal>lost"
          expected_close: "date?"
          lost_reason: "text?"
          closed_at: "datetime?"
        owner: salesperson
        search: [title]
        order: -created_at
        audit: true
        bounds: {value: {min: 0}, expected_close: {min: $today}}
        targets: {contact: {company: $company}}
        frozen: {value: {stage: won}, company: {stage: won}}
        delete: {blocked_by: [Activity]}
        moves:
          lost: {requires: [lost_reason], stamps: [closed_at]}
          won: {stamps: [closed_at]}
        access:
          read: granted
          write: granted
          delete: ["role:crm-manager", "role:admin"]
          assign: ["role:crm-manager", "role:admin"]
      Activity:
        fields:
          deal: fk:Deal
          salesperson: fk:User
          kind: "choice:call|email|meeting|note"
          due_at: "datetime?"
          done: bool
          done_at: "datetime?"
          notes: "text?"
        owner: salesperson
        order: due_at
        moves: {done: {stamps: [done_at]}}
        access: {read: granted, write: granted, assign: ["role:crm-manager", "role:admin"]}
pages:
  - Company: [list, detail, form]
  - Contact: [list, detail, form]
  - Deal: [list, detail, form]
  - Activity: [list, form]
# The back office's menu (the app menu): in a project of several parts it is the CRM's group.
navigation:
  - Deal: {label: Deals, icon: chart}
  - Company: {label: Companies, icon: box}
  - Contact: {label: Contacts, icon: users}
  - Activity: {label: Activities, icon: list}
seed: {Company: 20, Contact: 60, Deal: 40, Activity: 120}
