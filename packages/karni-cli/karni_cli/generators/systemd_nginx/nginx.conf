# The nginx site of {{slug}}: TLS, static files and uploads from disk, and everything
# else proxied to gunicorn's socket.
# `karni make deploy systemd-nginx` wrote this file, and it is yours to edit. deploy.sh fills
# in the names between at signs from the values at its top, installs the result as
# /etc/nginx/sites-available/<app>.conf, links it from sites-enabled, and reloads nginx only
# after `nginx -t` passes.

upstream @APP@_django {
    server unix:/run/@APP@/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;

    ssl_certificate     @CERT@;
    ssl_certificate_key @CERT_KEY@;

    # The largest upload the admin accepts, a little above the largest image.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # collectstatic's files. Their names stay the same between releases, so a browser
    # keeps one for an hour at most.
    location /static/ {
        alias @ROOT@/shared/static/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Uploads, served as files and never run as a page's script.
    location /media/ {
        alias @ROOT@/shared/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "script-src 'none'" always;
    }

    # Django: the site, the admin, the API, /healthz and /readyz.
    location / {
        proxy_pass http://@APP@_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/@APP@.access.log;
    error_log /var/log/nginx/@APP@.error.log;
}
