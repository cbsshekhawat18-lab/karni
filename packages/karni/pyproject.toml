[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni"
version = "0.2.0"
description = "Django + React framework that stays a versioned dependency, not a boilerplate: declare models and access, get the REST API, admin, permissions, tests and seed data. Built so AI coding agents (Claude Code, Cursor, Copilot) write only the domain code."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 licence expression; no "License ::" classifier (deprecated alongside it).
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chandrabhan Shekhawat", email = "cbsshekhawat18@gmail.com" }]
keywords = [
    "django",
    "react",
    "django-rest-framework",
    "framework",
    "full-stack",
    "boilerplate",
    "scaffolding",
    "code-generation",
    "ai-agents",
    "claude-code",
    "cursor",
    "copilot",
    "celery",
    "openapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # Django 5.2 LTS (security fixes until April 2028); 5.2.8 is the first
    # release that supports Python 3.14.
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4,<6",
    "drf-spectacular>=0.27",
    "django-filter>=24.2",
    "django-environ>=0.11",
    # The admin builds on unfold's action decorators and templates; move the
    # range deliberately, with the admin suite, not with every release.
    "django-unfold>=0.110,<0.111",
    "pydantic>=2",
    "redis>=5",
    "celery[redis]>=5.3",
    "django-celery-beat>=2.6",
    "django-celery-results>=2.5",
    "django-cors-headers>=4.4",
    "structlog>=24.1",
    "django-structlog>=8.0",
    # karni.transfer: XLSX import, export and templates (pure Python, no service).
    "openpyxl>=3.1",
    # karni.testing.factories (test data, the N+1 scaling check, seeding).
    # Imported only by tests and seed commands, never by the web process.
    "factory-boy>=3.3",
]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"
Changelog = "https://github.com/cbsshekhawat18-lab/karni/tree/main/docs/migrations"

# Karni's pytest plugin: KARNI_QUERY_BUDGET_MODE = "raise" for the test session
# and the `query_budget` fixture (karni.testing.pytest_plugin).
[project.entry-points.pytest11]
karni = "karni.testing.pytest_plugin"

[project.entry-points."karni.checks"]
architecture = "karni.testing.architecture:run_checks"
duplication = "karni.testing.duplication:run_check"

# History providers (karni.agent.history). Karni registers its built-in one
# like any third party would; it only shells out to `chronicle` when present.
[project.entry-points."karni.history_providers"]
gigai-chronicle = "karni.agent.history_chronicle:ChronicleProvider"

[project.optional-dependencies]
s3 = ["django-storages[s3]>=1.14", "boto3>=1.34"]
images = ["Pillow>=10.3"]
sentry = ["sentry-sdk>=2.0"]
social = ["django-allauth>=65.3"]
2fa = ["django-otp>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "Pillow>=10.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["karni"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni/accounts/migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Deprecations fail the suite: any use of a Karni deprecated alias (tests that
# assert one warns wrap it in pytest.warns), and any DeprecationWarning that
# Karni's own code triggers. Later entries take precedence.
filterwarnings = [
    "error::DeprecationWarning:karni(\\.|$)",
    "error::karni.deprecation.KarniDeprecationWarning",
]

# mypy is configured repo-wide in /mypy.ini (the Makefile and CI pass it explicitly).
