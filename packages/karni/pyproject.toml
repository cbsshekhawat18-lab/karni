[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni"
version = "0.1.0"
description = "Django framework where projects write only domain code: declare models and access; the API, admin, permissions, tests and seed data follow."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chandrabhan Shekhawat", email = "cbsshekhawat18@gmail.com" }]
keywords = ["django", "drf", "celery", "settings", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4,<6",
    "drf-spectacular>=0.27",
    "django-filter>=24.2",
    "django-environ>=0.11",
    # 0.97+ requires Django 5.2; keep in lockstep with the Django pin above.
    "django-unfold>=0.96,<0.97",
    "pydantic>=2",
    "redis>=5",
    "celery[redis]>=5.3",
    "django-celery-beat>=2.6",
    "django-celery-results>=2.5",
    "django-cors-headers>=4.4",
    "structlog>=24.1",
    "django-structlog>=8.0",
    # karni.testing.factories (test data, the N+1 scaling check, seeding).
    # Imported only by tests and seed commands, never by the web process.
    "factory-boy>=3.3",
]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://github.com/cbsshekhawat18-lab/karni/tree/main/docs"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"
Changelog = "https://github.com/cbsshekhawat18-lab/karni/tree/main/docs/migrations"

# Karni's pytest plugin: KARNI_QUERY_BUDGET_MODE = "raise" for the test session
# and the `query_budget` fixture (karni.testing.pytest_plugin).
[project.entry-points.pytest11]
karni = "karni.testing.pytest_plugin"

[project.entry-points."karni.checks"]
architecture = "karni.testing.architecture:run_checks"
duplication = "karni.testing.duplication:run_check"

# History providers (karni.agent.history). Karni registers its built-in one
# like any third party would; it only shells out to `chronicle` when present.
[project.entry-points."karni.history_providers"]
gigai-chronicle = "karni.agent.history_chronicle:ChronicleProvider"

[project.optional-dependencies]
s3 = ["django-storages[s3]>=1.14", "boto3>=1.34"]
images = ["Pillow>=10.3"]
sentry = ["sentry-sdk>=2.0"]
social = ["django-allauth>=65.3"]
2fa = ["django-otp>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "Pillow>=10.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["karni"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni/accounts/migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Deprecations fail the suite: any use of a Karni deprecated alias (tests that
# assert one warns wrap it in pytest.warns), and any DeprecationWarning that
# Karni's own code triggers. Later entries take precedence.
filterwarnings = [
    "error::DeprecationWarning:karni(\\.|$)",
    "error::karni.deprecation.KarniDeprecationWarning",
]

# mypy is configured repo-wide in /mypy.ini (the Makefile and CI pass it explicitly).
