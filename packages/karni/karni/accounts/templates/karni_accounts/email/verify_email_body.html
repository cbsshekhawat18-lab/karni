<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
      <p style="margin:0 0 16px;">Hi{% if user.first_name %} {{ user.first_name }}{% endif %},</p>
      <p style="margin:0 0 16px;">
        Thanks for signing up. Please confirm that <strong>{{ user.email }}</strong>
        is your email address.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{ link }}" style="display:inline-block;padding:10px 20px;background:#1f2933;color:#ffffff;text-decoration:none;border-radius:6px;">Verify email address</a>
      </p>
      <p style="margin:0 0 8px;font-size:13px;color:#52606d;">
        Or copy this link into your browser:<br>
        <a href="{{ link }}" style="color:#3b5bdb;word-break:break-all;">{{ link }}</a>
      </p>
      <p style="margin:16px 0 0;font-size:13px;color:#52606d;">
        If you did not create this account, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
