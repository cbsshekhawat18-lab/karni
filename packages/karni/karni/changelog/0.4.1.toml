# Karni 0.4.1: what changed since 0.4.0 that a project may notice.
# Schema and rules: karni/changelog/__init__.py. Migration notes: docs/migrations/0.4.1.md.
version = "0.4.1"

[[change]]
id = "public-read-writes-need-a-role"
kind = "behaviour"
symbol = "karni make --access public-read"
summary = """\
`--access public-read` now writes `Access(read=Public(), write=HasRole("staff"))`. \
In 0.4.0 it wrote `write=Authenticated()`, which with open registration lets anyone \
who signs up change and delete every row. Review each viewset that declares \
`read=Public(), write=Authenticated()`. `karni check` reports each one as karni.W102."""
mechanical = false
migration = "migrations/0.4.1.md#public-read-viewsets-review-who-may-write"

[[change]]
id = "public-creates-limited-by-default"
kind = "behaviour"
symbol = "BaseViewSet.create with create=Public()"
summary = """\
A `create` anyone may call is limited to KARNI_PUBLIC_CREATE_RATE (10 an hour per \
caller) without a `throttle` declaration, a request that fills the honeypot field \
(KARNI_PUBLIC_CREATE_HONEYPOT_FIELD, `homepage`) is answered 202 and saves nothing, \
and its import endpoints need a signed-in user. Raise or remove the limit if a public \
endpoint takes more than that from one caller."""
mechanical = false
migration = "migrations/0.4.1.md#public-creates-are-rate-limited"

[[change]]
id = "security-headers-by-default"
kind = "behaviour"
symbol = "karni.security.SecurityHeadersMiddleware"
summary = """\
Every response now carries a Content-Security-Policy, enforced with DEBUG off and \
report-only with DEBUG on, and a Permissions-Policy. A page that loads scripts, styles \
or fonts from another host, or runs an inline script, needs KARNI_CSP (or @csp_extend) \
before it reaches production."""
mechanical = false
migration = "migrations/0.4.1.md#security-headers-on-every-response"

[[change]]
id = "urls-marker"
kind = "project-files"
symbol = "config/urls.py"
summary = """\
The scaffold's config/urls.py carries a `# karni:urls` marker line inside \
urlpatterns, before `*welcome_urls()`. `karni make site` and `karni make view` \
insert routes there. The codemod adds the line to a project that lacks it."""
mechanical = true
codemod = "v0_4.urls_marker"
migration = "migrations/0.4.1.md#a-marker-for-project-routes-in-configurlspy"

[[change]]
id = "agent-files-public-site"
kind = "project-files"
symbol = "AGENTS.md and the agent adapter files"
summary = """\
The adapters say where app screens and a public site go, K302 and K306 are \
about app screens and the new-page procedure points at rule K309. Run \
`karni rules sync`, or `karni rules sync --check` reports the files as stale."""
mechanical = false
migration = "migrations/0.4.1.md#the-agent-files-run-karni-rules-sync"

[[change]]
id = "seed-refuses-occupied-tables"
kind = "behaviour"
symbol = "karni seed (manage.py karni_seed)"
summary = """\
karni seed prints the models it will write to and refuses (E617) when one of \
their tables already holds rows, users aside. A script that seeds a database \
twice, or seeds after loading data, passes --reset to start over or --force \
to add demo rows on top."""
mechanical = false
migration = "migrations/0.4.1.md#karni-seed-refuses-tables-that-already-hold-rows"

[[change]]
id = "staff-app-guard-and-dashboard"
kind = "project-files"
symbol = "frontend/src/layout.tsx and frontend/src/pages/home.tsx"
summary = """\
The scaffold's layout now wraps every page but a sign-in page in \
<AuthGuard explain>, builds its menu with @karni/ui's routeNavItems and offers \
Sign out, and its home page is <Dashboard> (the models that declare \
`class Karni: dashboard`) instead of the health-check placeholder. A project \
scaffolded earlier keeps its own files: copy the two from a fresh `karni new` \
to get the sign-in prompt and the dashboard."""
mechanical = false
migration = "migrations/0.4.1.md#the-staff-app-requires-sign-in-and-opens-on-a-dashboard"

[[change]]
id = "admin-loads-project-theme"
kind = "behaviour"
symbol = "KARNI_THEME_CSS, UNFOLD['STYLES'], STATICFILES_FINDERS"
summary = """\
The admin now loads the project's frontend/src/karni-theme.css (KARNI_THEME_CSS) \
as the static file karni/project-theme.css, served by \
karni.admin.theme.ProjectThemeFinder, which karni_settings() adds to \
STATICFILES_FINDERS. A project that appended its own admin stylesheet of \
--karni-* overrides can drop it, and a project that defines STATICFILES_FINDERS \
itself adds the finder to keep the file served."""
mechanical = false
migration = "migrations/0.4.1.md#the-admin-wears-the-projects-karni-themecss"

[[change]]
id = "karni-theme-light-colours-scoped"
kind = "behaviour"
symbol = "karni ui detect (karni-theme.css)"
summary = """\
karni-theme.css now writes light-only colours under `:root:not(.dark)` instead \
of `:root`, so they no longer override Karni's dark palette under \
<html class="dark">. A file written by 0.4.0 keeps overriding it until it is \
regenerated with `karni ui detect --force` (or edited by hand)."""
mechanical = false
migration = "migrations/0.4.1.md#karni-themecss-keeps-dark-mode"
