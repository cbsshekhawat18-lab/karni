# Karni 0.2.0: breaking changes and deprecations since 0.1.0.
# Schema and rules: karni/changelog/__init__.py. Migration notes: docs/migrations/0.2.md.
# `karni upgrade` runs each codemod (karni_cli/upgrades/<codemod>.py) in order and
# reports every manual change with its migration note.
version = "0.2.0"

# --- deprecated in 0.2, removed in 1.0 ------------------------------------------

[[change]]
id = "all-objects"
kind = "api-change"
symbol = "Model.all_objects"
replacement = 'Model.objects.without("soft_delete", reason=...)'
summary = """\
The all_objects manager is replaced by lifting the soft_delete scope by name. \
Until 1.0 it still works, but it now lifts only soft_delete (it used to drop \
every default-manager filter)."""
removed_in = "1.0"
mechanical = true
codemod = "v1_0.all_objects_to_without"
migration = "migrations/0.2.md#all_objects"

[[change]]
id = "all-with-deleted"
kind = "api-change"
symbol = "objects.all_with_deleted()"
replacement = 'objects.without("soft_delete", reason=...)'
summary = "The manager method is replaced by lifting the soft_delete scope by name."
removed_in = "1.0"
mechanical = true
codemod = "v1_0.all_with_deleted_to_without"
migration = "migrations/0.2.md#all_with_deleted"

[[change]]
id = "deleted-only"
kind = "api-change"
symbol = "objects.deleted_only()"
replacement = 'objects.without("soft_delete", reason=...).dead()'
summary = "The manager method is replaced by lifting soft_delete and keeping only dead rows."
removed_in = "1.0"
mechanical = true
codemod = "v1_0.deleted_only_to_without_dead"
migration = "migrations/0.2.md#deleted_only"

[[change]]
id = "soft-delete-manager-mixin"
kind = "base-rename"
symbol = "karni.managers.SoftDeleteManagerMixin"
replacement = "karni.managers.ScopedManagerMixin"
summary = """\
The manager mixin runs every named scope now, not just soft delete, so it was \
renamed. The old name is the same class."""
removed_in = "1.0"
mechanical = true
codemod = "v1_0.soft_delete_manager_mixin_to_scoped"
migration = "migrations/0.2.md#softdeletemanagermixin"

[[change]]
id = "object-permission-classes"
kind = "api-change"
symbol = "BaseViewSet.object_permission_classes"
replacement = "the access declaration (access = Access(read=..., write=...))"
summary = """\
Object-level permission classes on a BaseViewSet are replaced by the access \
declaration. They still run, after the access object check, until 1.0. The \
rule they encode has to be re-expressed as access predicates by hand."""
removed_in = "1.0"
mechanical = false
codemod = "v1_0.object_permission_classes_to_access"
migration = "migrations/0.2.md#object_permission_classes"

[[change]]
id = "related-lookups"
kind = "api-change"
symbol = "karni.api.expansion.related_lookups"
replacement = "karni.api.optimizer.optimize(queryset, serializer, scope=...)"
summary = """\
The expansion-only lookup helper is subsumed by the serializer-walking query \
optimiser, which takes a queryset and a serializer instead of expand paths."""
removed_in = "1.0"
mechanical = false
codemod = "v1_0.related_lookups_to_optimize"
migration = "migrations/0.2.md#related_lookups-and-scoped_related_lookups"

[[change]]
id = "scoped-related-lookups"
kind = "api-change"
symbol = "karni.api.expansion.scoped_related_lookups"
replacement = "karni.api.optimizer.optimize(queryset, serializer, scope=...)"
summary = """\
The scoped expansion lookup helper is subsumed by the query optimiser, which \
applies each target viewset's read scope itself."""
removed_in = "1.0"
mechanical = false
codemod = "v1_0.scoped_related_lookups_to_optimize"
migration = "migrations/0.2.md#related_lookups-and-scoped_related_lookups"

# --- breaking in 0.2 -----------------------------------------------------------

[[change]]
id = "agent-guidance-files"
kind = "project-files"
symbol = "AGENTS.md, CLAUDE.md, .cursorrules, .claude/commands/*.md"
replacement = "karni.rules.py plus adapters generated by `karni rules sync`"
summary = """\
Hand-written agent guidance files became generated adapters. The project's own \
additions move to karni.rules.py verbatim, module blocks to .karni/modules/, and \
the originals are backed up under .karni/backup/."""
mechanical = true
codemod = "v0_2.agent_guidance"
migration = "migrations/0.2.md#agent-guidance-files"

[[change]]
id = "mandatory-access"
kind = "behaviour"
symbol = "karni.api.BaseViewSet"
replacement = 'access = Access(read=..., write=...) or access = Unscoped(reason="...")'
summary = """\
Every BaseViewSet must declare access. A viewset without one fails `karni check` \
(viewset-access) and denies every request at runtime. An object outside the read \
scope answers 404; one readable but not writable answers 403."""
mechanical = false
migration = "migrations/0.2.md#every-baseviewset-declares-access"

[[change]]
id = "default-permission-classes"
kind = "behaviour"
symbol = 'REST_FRAMEWORK["DEFAULT_PERMISSION_CLASSES"]'
replacement = "rest_framework.permissions.IsAuthenticated"
summary = """\
Karni's default changed from IsAuthenticatedOrReadOnly to IsAuthenticated, and \
it no longer gates a BaseViewSet with an access declaration. It still covers \
plain DRF views and Unscoped viewsets, which no longer allow anonymous reads."""
mechanical = false
migration = "migrations/0.2.md#default_permission_classes"

[[change]]
id = "relation-read-scope"
kind = "behaviour"
symbol = "relation fields and ?expand="
summary = """\
A writable relation field accepts only primary keys the requester can read \
through the target model's viewset, and ?expand= embeds only readable rows (an \
unreadable to-one target renders as null)."""
mechanical = false
migration = "migrations/0.2.md#relations-and-expansion-follow-the-targets-read-scope"

[[change]]
id = "max-page-size"
kind = "behaviour"
symbol = "KarniPageNumberPagination.max_page_size"
replacement = "KARNI_MAX_PAGE_SIZE"
summary = """\
?page_size= is capped at KARNI_MAX_PAGE_SIZE, default 100 (was a hard-coded \
500). A paginator subclass may lower the cap, never raise it."""
mechanical = false
migration = "migrations/0.2.md#karni_max_page_size-defaults-to-100"

[[change]]
id = "pagination-required"
kind = "behaviour"
symbol = "pagination_class = None"
replacement = 'pagination = Unpaginated(max_rows=..., reason="...")'
summary = """\
pagination_class = None on a BaseViewSet is a class-definition error, and boot \
refuses REST_FRAMEWORK["PAGE_SIZE"] = None or a non-Karni default pagination \
class. An unpaginated list is declared with Unpaginated(...)."""
mechanical = false
migration = "migrations/0.2.md#unpaginated-lists-need-unpaginated"

[[change]]
id = "query-budgets"
kind = "behaviour"
symbol = "KARNI_QUERY_BUDGET_MODE"
replacement = 'query_budget = Budget(list=..., reason="...") on the viewset'
summary = """\
Every list, retrieve, create, update and destroy has a query budget. Karni's \
pytest plugin runs tests with KARNI_QUERY_BUDGET_MODE = "raise", so an action \
over budget now fails its test."""
mechanical = false
migration = "migrations/0.2.md#query-budgets-fail-tests"

[[change]]
id = "roles-as-data"
kind = "behaviour"
symbol = "KARNI_ROLES and migrate"
replacement = "KARNI_ROLES = {...}; karni sync-roles"
summary = """\
Roles are data (ADR 0002): migrate now creates the roles KARNI_ROLES declares \
(staff, user and customer by default, as groups plus Role rows with grants) and \
a Role row for every existing group. Nothing is deleted; Can('app.model:action') \
is available in access declarations."""
mechanical = false
migration = "migrations/0.2.md#roles-as-data"

[[change]]
id = "row-level-scoping"
kind = "behaviour"
symbol = "admin row scope"
replacement = 'access = Granted(); scope_exempt = True, scope_exempt_reason = "..."'
summary = """\
Row-level scoping (ADR 0002, P2): access = Granted() scopes a viewset by the \
roles' grants and is what karni make viewset writes, and the admin now shows \
only the rows the user's grants reach — a staff user with Django permissions \
but no grant sees nothing. scope_exempt opts a viewset or admin out, with a \
reason that karni check lists."""
mechanical = false
migration = "migrations/0.2.md#row-level-scoping"
