# Karni 0.5.2: what changed since 0.5.1 that a project may notice.
# Schema and rules: karni/changelog/__init__.py. Migration notes: docs/migrations/0.5.md.
version = "0.5.2"

[[change]]
id = "frontend-npm-floor"
kind = "project-files"
symbol = "frontend/package.json engines"
summary = """\
A new project's frontend ships a package-lock.json and asks for npm 10.8, \
not npm 11, in `engines`, so plain `npm install` works on the npm that Node 20 \
and 22 bundle. The codemod changes `"npm": ">=11"` to `"npm": ">=10.8"`. A \
project without a package-lock.json runs its first install once with npm 11.6 \
or later and commits the lock."""
mechanical = true
codemod = "v0_5.frontend_npm_floor"
migration = "migrations/0.5.md#the-frontend-installs-with-plain-npm-install"

[[change]]
id = "written-row-scope"
kind = "behaviour"
symbol = "BaseViewSet.perform_create / perform_update"
summary = """\
A create or an update must leave the row inside its own access predicate's \
rows, checked in the save's transaction: a listing posted into someone else's \
shop under write=Owned("seller__user") is refused with a 403 (E134) and nothing \
is saved. Override BaseViewSet.check_written_row() where a project needs \
another rule."""
mechanical = false
migration = "migrations/0.5.md#a-written-row-must-stay-inside-the-callers-write-scope"

[[change]]
id = "recipe-rules"
kind = "project-files"
symbol = "karni.yaml rule keys of the booking, crm, lms, marketplace and data-portal recipes"
summary = """\
The five recipes declare their business rules in karni.yaml (bounds, unique, \
targets, frozen, delete, moves, actions, access delete and assign). A project \
built from one before 0.5.2 copies the keys it wants from the new recipe, \
clears rows that a new unique rule would refuse, and runs karni build \
--allow-destructive."""
mechanical = false
migration = "migrations/0.5.md#rules-a-karniyaml-can-say-and-the-recipes-that-use-them"

[[change]]
id = "app-recipes"
kind = "project-files"
symbol = "karni.yaml app.recipe"
replacement = "app.recipes: [<name>]"
summary = """\
A project may hold several recipes, so karni.yaml lists them in \
app.recipes. karni-cli still reads app.recipe, as a list of one, with a \
KarniDeprecationWarning, and stops reading it in 1.0. The codemod rewrites \
the key in place and keeps the rest of the file."""
mechanical = true
codemod = "v0_5.recipe_list"
migration = "migrations/0.5.md#a-project-lists-its-recipes-in-apprecipes"
