# pre-commit hooks for the Karni monorepo.
#
#   pipx install pre-commit   # or: make install (adds it to your venv)
#   pre-commit install                      # commit-time hooks
#   pre-commit install --hook-type pre-push # + mypy on push
#
# The UI hooks run each package's OWN pinned prettier/eslint from its
# node_modules (run `make install-ui` first), from inside the package
# directory so its .prettierignore and eslint config apply exactly as in
# `npm run lint` / `npm run format`.

default_language_version:
  python: python3.12

exclude: |
  (?x)^(
    templates/|
    packages/karni-cli/karni_cli/_templates/|
    .*/dist/|
    .*/node_modules/|
    .*/package-lock\.json$
  )

repos:
  # --- hygiene ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig.json is JSONC (comments allowed).
        exclude: (^|/)tsconfig[^/]*\.json$
      - id: debug-statements

  # --- Python: ruff lint + format ---------------------------------------------
  # Ruff resolves the closest config per file: each package's pyproject
  # [tool.ruff] inside packages/karni, packages/karni-cli and
  # modules/karni-payments; the root ruff.toml everywhere else.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- UI packages: prettier + eslint (package-local toolchains) ---------------
  - repo: local
    hooks:
      - id: prettier-karni-ui
        name: prettier (packages/karni-ui)
        language: system
        files: ^packages/karni-ui/
        types_or: [javascript, jsx, ts, tsx, css, json, markdown, yaml]
        entry: >-
          bash -c 'cd packages/karni-ui &&
          node_modules/.bin/prettier --write --ignore-unknown "${@#packages/karni-ui/}"' --
      - id: eslint-karni-ui
        name: eslint (packages/karni-ui)
        language: system
        files: ^packages/karni-ui/
        types_or: [javascript, jsx, ts, tsx]
        entry: >-
          bash -c 'cd packages/karni-ui &&
          node_modules/.bin/eslint --max-warnings=0 --no-warn-ignored "${@#packages/karni-ui/}"' --
      - id: prettier-payments-ui
        name: prettier (modules/karni-payments/ui)
        language: system
        files: ^modules/karni-payments/ui/
        types_or: [javascript, jsx, ts, tsx, css, json, markdown, yaml]
        entry: >-
          bash -c 'cd modules/karni-payments/ui &&
          node_modules/.bin/prettier --write --ignore-unknown "${@#modules/karni-payments/ui/}"' --
      - id: eslint-payments-ui
        name: eslint (modules/karni-payments/ui)
        language: system
        files: ^modules/karni-payments/ui/
        types_or: [javascript, jsx, ts, tsx]
        entry: >-
          bash -c 'cd modules/karni-payments/ui &&
          node_modules/.bin/eslint --max-warnings=0 "${@#modules/karni-payments/ui/}"' --

      # --- mypy on push (whole-package runs; per-file mypy is misleading) -----
      - id: mypy
        name: mypy (make typecheck-py)
        language: system
        entry: make typecheck-py
        pass_filenames: false
        types: [python]
        stages: [pre-push]
