[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-payments"
version = "0.3.1"
description = "Payments for Karni: hosted checkout, refunds and signature-verified webhooks for Stripe and Razorpay, with a test provider for CI. Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain: the API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers Claude Code, Cursor and Copilot; the build fails when an agent hand-writes what Karni ships."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639 licence expression; no "License ::" classifier (deprecated alongside it).
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chandrabhan Shekhawat", email = "cbsshekhawat18@gmail.com" }]
keywords = ["django", "karni", "payments", "stripe", "razorpay", "checkout", "webhooks", "react"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# Range-pinned per the module contract (docs/modules.md): karni 0.x minors
# may break, so a module pins the minor it was built against.
dependencies = ["karni>=0.3,<0.4"]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"
Changelog = "https://github.com/cbsshekhawat18-lab/karni/tree/main/docs/migrations"

[project.optional-dependencies]
stripe = ["stripe>=10"]
razorpay = ["razorpay>=1.4"]

# The module's settings fragment: karni_settings() merges these defaults for
# every project that installs karni-payments (new top-level names only).
[project.entry-points."karni.settings"]
payments = "karni_payments.conf:DEFAULTS"

# Error codes (PAY001...) for `karni explain` and docs/errors.md.
[project.entry-points."karni.errorcodes"]
payments = "karni_payments.errorcodes:CODES"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["karni_payments"]
# Pin the agent-guidance fragment into the wheel explicitly — `karni add`
# reads it through importlib.resources after install.
artifacts = ["karni_payments/AGENTS.fragment.md"]

[tool.hatch.build.targets.sdist]
exclude = ["ui/", "tests/"]
artifacts = ["karni_payments/AGENTS.fragment.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni_payments/migrations", "*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
