[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-charts"
version = "0.5.0"
description = "Saved charts for Karni: charts defined and previewed in the admin, served through each resource's aggregate action under its access. Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain. The API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers every coding agent. The build fails when an agent hand-writes what Karni ships."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["django", "karni", "charts", "analytics", "dashboard", "aggregation", "react"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# Range-pinned per the module contract (docs/modules.md): karni 0.x minors
# may break, so a module pins the minor it was built against.
dependencies = ["karni>=0.5,<0.6"]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"

# The catalog entry, karni_charts/karni.module.toml: `karni modules`, `karni add`
# and `karni remove` read it.
[project.entry-points."karni.modules"]
charts = "karni_charts"

# The settings fragment: karni_settings() merges DEFAULTS into every project
# that installs this module (new top-level names only).
[project.entry-points."karni.settings"]
charts = "karni_charts.conf:DEFAULTS"

# Error codes (CHART001...) for `karni explain` and docs/errors.md.
[project.entry-points."karni.errorcodes"]
charts = "karni_charts.errorcodes:CODES"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-django>=4.8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["karni_charts"]
# `karni add` reads the agent guidance through importlib.resources after install.
artifacts = ["karni_charts/AGENTS.fragment.md", "karni_charts/karni.module.toml", "karni_charts/templates/**"]

[tool.hatch.build.targets.sdist]
exclude = ["ui/", "tests/"]
artifacts = ["karni_charts/AGENTS.fragment.md", "karni_charts/karni.module.toml", "karni_charts/templates/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni_charts/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Inside a project checkout, never pick up the project's manage.py / tests package.
django_find_project = false
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
