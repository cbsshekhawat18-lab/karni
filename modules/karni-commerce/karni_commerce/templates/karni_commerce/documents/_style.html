<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10.5pt; color: #111; margin: 0; padding: 24px; background: #fff; }
  .sheet { max-width: 760px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; border-bottom: 2px solid #111; padding-bottom: 12px; }
  h1 { font-size: 20pt; margin: 0 0 4px; }
  .muted { color: #555; }
  .pre { white-space: pre-line; }
  .parties { display: flex; gap: 32px; margin: 20px 0; flex-wrap: wrap; }
  .parties > div { flex: 1 1 200px; }
  h2 { font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #555; margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { font-size: 9pt; color: #555; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .totals { margin-left: auto; width: 320px; max-width: 100%; }
  .totals td { border: 0; padding: 3px 4px; }
  .totals .grand td { border-top: 2px solid #111; font-weight: 700; padding-top: 6px; }
  .box { display: inline-block; width: 14px; height: 14px; border: 1px solid #111; }
  footer { margin-top: 28px; font-size: 9pt; color: #555; border-top: 1px solid #ddd; padding-top: 8px; }
  @media print { body { padding: 0; } }
</style>
