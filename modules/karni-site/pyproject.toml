[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-site"
version = "0.4.0"
description = "Public websites for Karni: the current page in a menu, a design's inline scripts under the Content-Security-Policy, error pages that cannot fail, and public forms that work with and without JavaScript. Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain. The API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers Claude Code, Cursor and Copilot. The build fails when an agent hand-writes what Karni ships."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["django", "karni", "website", "templates", "navigation", "csp", "seo", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
# Range-pinned per the module contract (docs/modules.md).
dependencies = ["karni>=0.4,<0.5"]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"

# The settings fragment: karni_settings() merges DEFAULTS into every project
# that installs this module (new top-level names only).
[project.entry-points."karni.settings"]
site = "karni_site.conf:DEFAULTS"

[project.entry-points."karni.errorcodes"]
site = "karni_site.errorcodes:CODES"

[project.entry-points."karni.checks"]
site = "karni_site.checks:run_checks"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-django>=4.8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["karni_site"]
# `karni add` reads the agent guidance through importlib.resources after install.
artifacts = ["karni_site/AGENTS.fragment.md", "karni_site/templates/**", "karni_site/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/"]
artifacts = ["karni_site/AGENTS.fragment.md", "karni_site/templates/**", "karni_site/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni_site/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Inside a project checkout, never pick up the project's manage.py / tests package.
django_find_project = false
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
