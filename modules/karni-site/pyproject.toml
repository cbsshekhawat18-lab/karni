[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-site"
version = "0.5.0"
description = "Public websites for Karni: every text, image and menu editable in the admin, public forms, redirects, and error pages that cannot fail. Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain. The API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers every coding agent. The build fails when an agent hand-writes what Karni ships."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["django", "karni", "website", "templates", "navigation", "csp", "seo", "cms", "menus", "redirects", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Typing :: Typed",
]
# Range-pinned per the module contract (docs/modules.md).
dependencies = ["karni>=0.5,<0.6"]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"

# The catalog entry, karni_site/karni.module.toml: `karni modules`, `karni add`
# and `karni remove` read it.
[project.entry-points."karni.modules"]
site = "karni_site"

# The settings fragment: karni_settings() merges DEFAULTS into every project
# that installs this module (new top-level names only).
[project.entry-points."karni.settings"]
site = "karni_site.conf:DEFAULTS"

[project.entry-points."karni.errorcodes"]
site = "karni_site.errorcodes:CODES"

[project.entry-points."karni.checks"]
site = "karni_site.checks:run_checks"

# `karni check --seo`: every page rendered and checked (karni_site.checks_seo).
[project.entry-points."karni.checks.seo"]
site = "karni_site.checks_seo:run_checks"

# The content editor role (karni.accounts roles): merged under KARNI_ROLES.
[project.entry-points."karni.roles"]
site = "karni_site.roles:declared"

[project.optional-dependencies]
# Pillow: the smaller WebP copies of uploaded images and the upload cap. Without it images
# are shown as uploaded, with their width and height.
images = ["Pillow>=10.3"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-django>=4.8", "ruff>=0.5", "Pillow>=10.3"]

[tool.hatch.build.targets.wheel]
packages = ["karni_site"]
# `karni add` reads the agent guidance through importlib.resources after install.
artifacts = ["karni_site/AGENTS.fragment.md", "karni_site/karni.module.toml", "karni_site/templates/**", "karni_site/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/"]
artifacts = ["karni_site/AGENTS.fragment.md", "karni_site/karni.module.toml", "karni_site/templates/**", "karni_site/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni_site/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# Inside a project checkout, never pick up the project's manage.py / tests package.
django_find_project = false
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
