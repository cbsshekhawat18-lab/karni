[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karni-impersonation"
version = "0.4.0"
description = "Safe 'log in as user' for Karni support staff: an explicit permission, no privilege escalation, a banner, a time limit, both identities in the audit trail. Karni is an open-source Django + React framework for building with AI coding agents. Your agent writes only your domain. The API, admin, permissions and React screens come from a package you upgrade, not code it rewrites in each project. One rule set covers Claude Code, Cursor and Copilot. The build fails when an agent hand-writes what Karni ships."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["django", "karni", "impersonation", "login-as", "support", "audit", "react"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
# Range-pinned per the module contract (docs/modules.md).
dependencies = ["karni>=0.4,<0.5"]

[project.urls]
Homepage = "https://github.com/cbsshekhawat18-lab/karni"
Documentation = "https://cbsshekhawat18-lab.github.io/karni/"
Repository = "https://github.com/cbsshekhawat18-lab/karni"
Issues = "https://github.com/cbsshekhawat18-lab/karni/issues"

[project.entry-points."karni.settings"]
impersonation = "karni_impersonation.conf:DEFAULTS"

[project.entry-points."karni.errorcodes"]
impersonation = "karni_impersonation.errorcodes:CODES"

[project.entry-points."karni.checks"]
impersonation = "karni_impersonation.checks:run_checks"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-django>=4.8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["karni_impersonation"]
artifacts = ["karni_impersonation/AGENTS.fragment.md", "karni_impersonation/templates/**"]

[tool.hatch.build.targets.sdist]
exclude = ["ui/", "tests/"]
artifacts = ["karni_impersonation/AGENTS.fragment.md", "karni_impersonation/templates/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["karni_impersonation/migrations", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
